  <text x="390" y="770" class="small">UC-1: Storybook 필수 · 다중 Storybook이면 Primary 지정 · Integration Prompt/Creativity 적용</text>
  <text x="390" y="805" class="small">UC-5: source lookup 실패 시 최소 사실만 생성 · 기존 플레이 사실과 충돌하면 재생성</text>
  <text x="390" y="840" class="small">UC-4/7: Turn Resolution은 고정하고 narration만 spoiler-safe하게 재생성 가능</text>
