  <path d="M180 640 L640 560" class="line"/>
  <path d="M1465 355 L1015 360" class="line"/>
  <path d="M1465 385 L1285 420" class="line"/>

  <path d="M715 360 L645 360" class="dash"/>
  <text x="680" y="340" text-anchor="middle" class="small">include UC-1</text>
  <path d="M715 500 L745 408" class="dash"/>
  <text x="745" y="470" class="small">첫 Scene</text>
  <path d="M905 410 L850 490" class="dash"/>
  <text x="900" y="472" class="small">source 없음</text>
  <path d="M990 340 L1035 285" class="dash"/>
