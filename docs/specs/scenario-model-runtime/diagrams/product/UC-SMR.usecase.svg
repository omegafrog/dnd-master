<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; fill:#111; }
      .title { font-size:30px; font-weight:700; }
      .actor { font-size:22px; font-weight:600; }
      .uc { fill:#fff; stroke:#222; stroke-width:2; }
      .box { fill:#fafafa; stroke:#555; stroke-width:2; rx:18; }
      .line { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#555; stroke-width:1.8; fill:none; stroke-dasharray:8 6; marker-end:url(#arrow); }
      .label { font-size:18px; }
      .small { font-size:15px; fill:#444; }
    </style>
  </defs>
  <text x="800" y="48" text-anchor="middle" class="title">Scenario Model Runtime — Product Use Cases</text>

  <rect x="280" y="90" width="1040" height="800" class="box"/>
