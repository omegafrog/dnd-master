  <text x="105" y="656" text-anchor="middle" class="label">Source / RAG</text>

  <circle cx="1500" cy="310" r="24" fill="none" stroke="#222" stroke-width="3"/>
  <line x1="1500" y1="334" x2="1500" y2="405" stroke="#222" stroke-width="3"/>
  <line x1="1462" y1="365" x2="1538" y2="365" stroke="#222" stroke-width="3"/>
  <line x1="1500" y1="405" x2="1466" y2="460" stroke="#222" stroke-width="3"/>
  <line x1="1500" y1="405" x2="1534" y2="460" stroke="#222" stroke-width="3"/>
  <text x="1500" y="500" text-anchor="middle" class="actor">AI Game Master</text>

  <ellipse cx="530" cy="220" rx="185" ry="58" class="uc"/>
