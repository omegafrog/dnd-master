conditional_changes:
  - 모험별 소유 키와 복합 외래키를 갖는 초기 상황 자료 테이블 두 개를 새 데이터베이스 마이그레이션으로 만든다. 기존 패키지 단위 테이블과 V68 파일은 수정하거나 이관하지 않는다.
  - 기존 준비 생성 포트에 연결하는 AI 호출 어댑터와 입력·응답 계약을 기존 통합 패턴으로 구현한다.
  - 새 상태의 JSON 저장·복원과 생성자·호출부·테스트 자료를 새 필드에 맞춰 함께 변경한다. 이전 저장 형식을 읽기 위한 어댑터는 만들지 않는다.
review:
