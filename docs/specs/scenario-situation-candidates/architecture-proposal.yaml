schema_version: 1
status: reviewed
purpose: 확정된 제품 요구와 사용자가 지시한 개발용 범위를 반영한 구현 설계 작성 입력이다. 완료된 구현 설계 명세는 별도 문서와 다이어그램으로 검증한다.
requirements: [R-01, R-02, R-03, R-04, R-05, R-06, R-07, R-08, R-09, R-10]
targets: [ST-03, ST-04, ST-05]
accepted:
  - 기존 상황 준비와 저장 구조를 확장한다.
  - 적격 준비 상황 선택·현재 상황 갱신·선택 상황 사용량 또는 ending 완료를 기존 턴에서 함께 검증·확정한다.
  - 초기 필수 상황과 중간 후보부터 모험별로 독립 생성·저장하고 모험끼리 공유하지 않는다.
  - 기존 모험은 그대로 두고 새로 준비하는 모험부터 이번 기능을 적용한다. 사용자 답변은 기존건 놔둬이다.
  - 개발용이므로 기존 데이터 형식의 호환성 유지와 이관 작업은 이번 범위에서 제외한다. 사용자 답변은 개발용이니까 그냥 호환성 생각하지 말고 하라고이다.
proposed_contracts:
  ownership: 기존 시나리오 준비 책임이 모험별 초기 상황 세트를 준비하고 기존 모험 실행 책임이 해당 모험의 선택·사용·현재 장면을 소유한다. 새 배포 서비스는 만들지 않는다.
  preparation_identity: 시작 준비에 사용되는 모험 식별자를 상황 준비와 저장까지 전달한다. 재시도 시 세션에 고정된 동일 모험 식별자를 먼저 복원 또는 확보한 뒤 상황을 조회·생성한다.
  preparation_timing: 모험 시작 전 선택된 STORYBOOK에 RAG 검색을 수행해 검색된 후보에서 필수 상황·선행 관계를 추출하고, 그 추출 결과를 반영한 초기 상황과 중간 후보를 준비한다. 검색되지 않은 원문 상황을 빠짐없이 찾았다고 보장하지 않는다.
  preparation_persistence: 상황 자료의 조회와 저장 키에 모험 식별자를 포함하고 시나리오 패키지·개정은 출처 참조로 보존한다. 다른 모험의 결과를 초기 준비 결과로 재사용하지 않는다.
  original_source_coverage: 선택된 STORYBOOK에 대한 기존 RAG 검색 API를 사용하고, 제한된 수의 검색 후보만 입력한다. 문서 식별·유형·추출 버전·위치와 소유 범위를 검사하고 발췌 크기를 제한한다. 검색 후보만으로 원문 전체 대조가 완료됐다고 처리하지 않으며, 검색 누락을 검증했다고 주장하지 않는다.
  required_situation_extraction: 제한된 RAG 후보 구간을 한 번의 구조화된 JSON 요청으로 추출한다. 모델은 요약·명시적 isEnding·근거 위치와 선행 상황 summary 문구를 반환한다. 모델은 선행 인덱스나 ID를 반환하지 않으며 서버가 summary를 유일하게 대조해 모험별 필수 상황 ID와 관계를 만든다. 원문 전체를 다시 넣거나 배치별 정정 호출을 하지 않으며 RAG 미검색 상황의 누락을 보장하지 않는다.
  initial_situation_json_schemas:
    transport: InitialSituationGmPort.Request에 필수 객체 outputSchema를 포함해 HTTP 내부 요청부터 controller와 completion router를 거쳐 Codex AiExecutionRequest.outputSchema까지 전달한다. 출력 형식은 JSON이며, 스키마가 없거나 strict object 형식이 아니면 요청 생성 단계에서 거부한다. 기존 다른 Provider 동작은 유지한다.
    common: 각 응답별 JSON Schema는 모든 object에 허용 properties, 전체 required 목록, additionalProperties=false를 명시한다. private GM 응답은 source-reference 객체를 직접 반환하지 않고 해당 작업의 서버가 부여한 허용 sourceRefIds 목록 중 ID를 반환한다. 프롬프트는 서버가 부여한 각 ID와 정본 ScenarioSourceReference의 대응을 제공하며 서버는 허용 목록 밖의 ID를 거부한다. 중복 참조는 기존 List 동작을 유지하며, 허용 목록이 비면 maxItems=0이다. 추출에는 허용 목록이 있을 때 하나 이상의 sourceRefId를 요구한다. 기존 원문 내용·위치 검증은 유지한다.
    required_extract: 응답 항목은 summary, prerequisiteSummaries, sourceRefIds, isEnding을 받는다. 모델은 상황 ID·선행 ID·상황 인덱스를 반환하지 않는다. prerequisiteSummaries는 목록의 유일한 summary와 정확히 일치해야 하며 서버가 모험별 ID 관계로 변환한다.
    backbone: 하나 이상의 stages와 최상위 sourceRefIds를 요구한다. 단계 배열 순서는 준비 자료 나열 순서이며 플레이 순서를 정하지 않는다. 항목은 role, coreProblem, funnelSummary, requiredSituationSummaries, sourceRefIds만 반환하고 서버가 단계 순서와 ID를 부여한다. requiredSituationSummaries는 제공된 summary와 정확히 일치해야 하며 서버가 stage ID와 필수 상황 ID 관계를 만든다. 모델은 상황 인덱스를 반환하지 않는다.
    detailed_stage: 응답을 요청된 필수 상황과 같은 순서·같은 개수의 requiredSituationDetails와 0개 이상 intermediateSituationCandidates로 분리한다. 각 필수 상세의 opening boolean을 사용하며 첫 단계에서 정확히 하나만 true, 이후 단계에서는 모두 false인지 서버가 검증한다. 상황 인덱스나 ID는 응답하지 않는다. 상황 항목의 title과 description은 공백 제거 후 비어 있지 않고 각각 120·2000 Unicode 코드 포인트 이내다. intents와 기존 출처·지도·필수 선행 관계는 서버 정본으로 복원한다. 모델이 상황·핵심 요소 ID 또는 선행 ID를 만들지 않는다. 단계별 후보 최소 개수를 schema·prompt·게시 검증에서 강제하지 않는다. 의미상 장면 적합성은 프롬프트와 실제 모델 검증으로 확인하며 형식 검사만으로 보장하지 않는다.
    opening_situation: requiredSituationDetails의 각 항목은 opening boolean을 반환한다. 첫 단계에서 정확히 하나가 true이고 이후 단계에서는 모두 false인지 서버가 검증한다. openingSituationIndex는 요청·응답하지 않는다.
    supplemented_situation_ids: 선택·보완 상황 ID는 서버가 부여한다. 모델은 상황 ID나 선행 ID를 만들지 않으며, 선택 상황에 원문에서 검토되지 않은 선행 관계를 추가하지 않는다. 필수 상황의 ID·자료·근거·선행 관계는 서버가 보존한다.
    validation_boundary: 스키마는 JSON 모양을 제한한다. sourceRefIds는 해당 작업의 허용 목록 순서로 정본 참조를 복원한다. 원문 위치·제공 맵·상황 관계·전체 결과는 애플리케이션에서 검증한다. RAG가 검색하지 못한 원문 상황의 누락은 증명하지 않는다.
  preparation_retry: 같은 모험의 동일 준비 요청은 이미 게시된 완성 결과를 재사용한다. 완성 결과가 없으면 저장되지 않은 부분 준비 결과를 버리고 같은 모험 ID로 전체 초기 준비를 다시 수행한다. 완료 전 모험 시작을 허용하지 않는다.
  ingredients: 기존 상황 의도와 대상 참조를 활용하고 필수 여부·원문 선행 관계·원문 추출 또는 GM 보완의 구분·제공 맵 참조를 추가한다. 상세 사건 대본이나 일괄적인 추가 필수 요소는 만들지 않는다.
  ordering: 원문에 명시된 상황의 선행 관계를 참조로 검증한다. 기존 단계의 연속 순서만으로 원문에 없는 상황 순서를 강제하지 않는다.
  selection: GM 입력에 모험의 현재 장면, 그 장면을 뒷받침하는 활성 준비 상황, 전체 단계에서 선택 가능한 준비 후보의 ID·title·description·의도·사용 상태와 확정 사건을 구분해 전달한다. 입력 한도 80% 안에서 고정 40%·기록 10%·압축 대화 15%·최근 대화 최대 20% 구역과 최신 문맥의 잔여 byte를 각각 검사한다. 전체 선택 가능 후보를 턴 문맥 JSON으로 직렬화한 크기는 UTF-8 8,192 byte 이하이며 후보 개수 자체에는 고정 상한을 두지 않는다. 후보·필수 문맥은 생략·절단하지 않는다. 준비 초과 결과는 직전 응답을 재사용하는 한 차례 보정 후에도 넘으면 게시하지 않고, 턴 입력 예산 초과는 구역 진단 후 같은 입력을 재시도하지 않는다. 응답은 계속 진행 또는 적격 준비 상황 선택만 표현한다. 임의 새 장면 전환은 허용하지 않는다.
  new_situation_response: runtime-turn-response.json의 TRANSITION은 eligible selectedSituationId만 허용한다. newSituation을 포함한 임의 새 상황 필드는 거부한다. CONTINUE는 상황 선택 필드를 허용하지 않는다. 다음 상황 부재 시 그래프의 적격 필수 상황을 선택하고, 없으면 상태 변경 없이 진행을 거부한다.
  admission: RuntimeTurnApplicationService가 선택 후보의 모험 소유권·선행 조건·확정 사건을 검증한다. 서버는 준비된 상황만 전환 후보로 허용하고 임의 새 장면 응답을 거부한다. 상황 ID는 서버가 부여한다.
  turn_commit: 검증된 상황 종료, 다음 적격 준비 상황, 선택 상황 완료 수 또는 ending 완료 상태를 PendingRuntimeState에서 대기한다. 이 상태는 기존 턴 확정에서 게임 결과와 함께 저장한다. 굴림 대기·검증·저장 실패는 상황·사용량·완료 상태를 바꾸지 않는다.
  pending_roll: 플레이어 굴림 대기 중에는 제안만 보존하며 상황의 사용이나 전환을 확정하지 않는다. 복원·재시도 때 동일 대기 제안을 이어받는다.
  provided_maps: 상황에 적합한 제공 맵 참조만 허용한다. 적합한 맵이 없으면 맵 없이 처리하며 다른 모험의 지도 실행 상태를 가져오지 않는다.
  grounding: 확인한 RAG 후보와 GM 보완을 구분한다. RAG 조회 실패, AI 응답 형식 오류, 출처 위조, 잘못된 선행 관계, 다른 모험 참조는 준비를 실패시킨다. 검색 누락을 완전성으로 주장하지 않는다.
  compatibility: 기존 자료 자동 이관·호환성 유지·기존 형식의 복원 어댑터·기존 실행의 회귀 지원은 제외한다. 기존 자료를 삭제하지 않으며 신규 모험의 경로는 패키지 단위 공용 상황 자료로 되돌아가지 않는다. 새 형식에서의 재시작·굴림 대기·중복 요청 복구는 반드시 구현한다.
  recovery: 기존 턴의 소유권·버전·중복 요청·실패 저장 및 복구 절차를 유지한다. 실제 기술 실패를 새 상황 생성으로 우회하거나 준비 완료로 표시하지 않는다.
  observability: 기존 준비와 턴 단계 진단에 모험 식별자·선택한 상황 식별자·계속/선택/완료/거부 분기·검증 결과를 기록한다. 미공개 스토리·원문·전체 프롬프트는 기록하지 않는다.
  verification: 제한된 RAG 후보 요청·응답 범위, JSON 출력 스키마, 고유 식별자, 허용된 출처 위치, 유효한 선행 식별자와 비순환 관계를 검사한다. 해당 검증은 검색되지 않은 원문 상황의 누락을 찾지 않으며 완전성을 주장하지 않는다. #378 종단 간 확인은 사용자 인터페이스를 통한 실제 모험 시작까지 통과 여부를 별도로 기록한다. 동일 패키지의 두 모험 분리, 동일 모험 재시도, 복수 후보, 후보 부재 시 상태 변경 없는 진행 거부, 출처 구분 보완, 맵 부재, 굴림 대기, 저장 실패와 재시작 복구도 검사한다.
