schema_version: 1
status: reviewed
purpose: 확정된 제품 요구와 사용자가 지시한 개발용 범위를 반영한 구현 설계 작성 입력이다. 완료된 구현 설계 명세는 별도 문서와 다이어그램으로 검증한다.
requirements: [R-01, R-02, R-03, R-04, R-05, R-06, R-07, R-08, R-09]
targets: [ST-03, ST-04, ST-05]
accepted:
  - 기존 상황 준비와 저장 구조를 확장한다.
  - 후보 선택·새 상황 생성·현재 상황 갱신을 기존 턴에서 함께 검증·확정한다.
  - 초기 필수 상황과 중간 후보부터 모험별로 독립 생성·저장하고 모험끼리 공유하지 않는다.
  - 기존 모험은 그대로 두고 새로 준비하는 모험부터 이번 기능을 적용한다. 사용자 답변은 기존건 놔둬이다.
  - 개발용이므로 기존 데이터 형식의 호환성 유지와 이관 작업은 이번 범위에서 제외한다. 사용자 답변은 개발용이니까 그냥 호환성 생각하지 말고 하라고이다.
proposed_contracts:
  ownership: 기존 시나리오 준비 책임이 모험별 초기 상황 세트를 준비하고 기존 모험 실행 책임이 해당 모험의 선택·사용·추가 상황을 소유한다. 새 배포 서비스는 만들지 않는다.
  preparation_identity: 시작 준비에 사용되는 모험 식별자를 상황 준비와 저장까지 전달한다. 재시도 시 세션에 고정된 동일 모험 식별자를 먼저 복원 또는 확보한 뒤 상황을 조회·생성한다.
  preparation_timing: 모험 시작 전 선택된 STORYBOOK 원문 전체를 읽고 직접 대조해 검토된 필수 상황·선행 관계 목록을 만든 뒤, 그 목록을 빠짐없이 반영한 필수 상황 전체와 중간 후보의 핵심 요소를 준비한다. 시작 후 생성으로 요구를 대체하지 않는다.
  preparation_persistence: 상황 자료의 조회와 저장 키에 모험 식별자를 포함하고 시나리오 패키지·개정은 출처 참조로 보존한다. 다른 모험의 결과를 초기 준비 결과로 재사용하지 않는다.
  original_source_coverage: 기존 원문 조회 API의 선택된 STORYBOOK 문서 source-preview를 사용한다. 위치가 보존된 전체 원문 구간과 문서 식별·유형·추출 버전·상태·경고를 검사한다. 제한된 검색 발췌나 추출 본문만으로는 원문 전체 대조를 완료한 것으로 처리하지 않는다. 검토 요청에 모든 원문 구간과 전체 추출 목록을 함께 전달할 수 없을 만큼 모델 입력 한도를 넘으면 준비에 실패한다.
  required_situation_review: 원문 구간별로 필수 상황을 추출한 뒤 별도 검토 요청 하나에 전체 원문 구간과 전체 추출 제안 목록을 함께 넣어 누락된 필수 상황·구간 간 명시된 선후 관계를 보완한다. 검토 뒤 잘못된 sourceRefs 또는 prerequisiteSituationIds가 있으면 잘못된 항목, 정수 인덱스로 번호 매긴 정본 원문 위치 참조, 알려진 상황 식별자를 전달해 정정 호출을 한 번 한다. 응답은 잘못된 항목과 순서·개수가 1:1 대응하는 correctedSituations 배열이며 항목별 허용 필드는 sourceRefIndexes와 prerequisiteSituationIds다. 인덱스는 정본 위치 참조 목록의 정수 인덱스다. 애플리케이션은 원래 ID와 summary를 복원하며 선택 입력된 ID는 원래 ID와 일치해야 한다. 개수 불일치·정수 아닌 값·범위 밖 인덱스는 거부한다. 기존 유효 항목을 보존하고 정정 항목을 합친 뒤 출처 참조·선행 식별자·순환을 포함해 전체 목록을 재검증한다. 여전히 잘못된 항목이 있으면 기존 검증 오류로 준비를 실패시키고 게시하지 않는다. 이는 반복 루프나 설정 가능한 횟수가 아니다. 검토가 끝난 목록만 이후 생성에 전달한다. 모델의 의미 검토가 완벽하다고 보장하지 않으며, 최종 필수 상황과 관계는 검토 목록의 모든 항목을 포함해야 한다.
  initial_situation_json_schemas:
    transport: InitialSituationGmPort.Request에 필수 객체 outputSchema를 포함해 HTTP 내부 요청부터 controller와 completion router를 거쳐 Codex AiExecutionRequest.outputSchema까지 전달한다. 출력 형식은 JSON이며, 스키마가 없거나 strict object 형식이 아니면 요청 생성 단계에서 거부한다. 기존 다른 Provider 동작은 유지한다.
    common: 각 응답별 JSON Schema는 모든 object에 허용 properties, 전체 required 목록, additionalProperties=false를 명시한다. private GM 응답은 source-reference 객체를 직접 반환하지 않고 해당 작업의 NUMBERED_ALLOWED_SOURCE_REFS 목록에 대응하는 sourceRefIndexes(0 이상 정수 배열)를 반환한다. 프롬프트는 인덱스와 정본 참조의 정확한 대응을 제공하며, 스키마와 서버가 각 인덱스의 유형·범위를 검사해 정본 ScenarioSourceReference로 변환한다. 중복 참조는 기존 List 동작을 유지하며, 허용 목록이 비면 maxItems=0이다. 추출에는 허용 목록이 있을 때 하나 이상의 인덱스를 요구한다. 기존 원문 내용·위치 검증은 유지한다.
    required_extract: requiredSituations 항목에 situationId, summary, prerequisiteSituationIds, sourceRefIndexes를 요구하며 해당 추출 작업의 허용 목록 인덱스는 하나 이상이다. 서버가 기존 RequiredSituation.sourceRefs로 변환한다.
    required_review: reviewed=true와 하나 이상의 requiredSituations를 요구한다.
    required_review_repair: reviewed=true 및 ordered correctedSituations를 요구한다. 각 응답 항목은 하나 이상의 0 이상 정수 sourceRefIndexes, prerequisiteSituationIds, nullable situationId를 포함한다. 항목 개수·순서는 잘못된 검토 항목 목록과 일치하고 ID·summary는 원본에서 복원한다.
    backbone: 하나 이상의 stages와 최상위 sourceRefIndexes를 요구한다. 단계마다 stageId, order, role, coreProblem, funnelSummary, sourceRefIndexes가 필요하며 해당 요청의 정본 허용 목록에 매핑한다.
    detailed_stage: 상세 생성 DTO 전체 필드에 대응하는 객체 스키마를 적용한다. top-level 및 상세 자식 객체의 sourceRefIndexes는 해당 요청의 정본 허용 목록을 가리킨다. 허용 참조가 없는 경우 각 인덱스 배열은 maxItems=0이다. 서버가 인덱스를 검증해 기존 DTO의 sourceRefs로 변환한다. 비공개 응답은 같은 응답의 정본 ID 목록을 가리키는 정수 인덱스를 사용한다. funnel.requiredRevelationIndexes는 revelations[].revelationId를 가리키며, 각 상황의 revelationIndexes, pressureIndexes, funnelIndexes, funnelPredicateIndexes, importantConsequenceIndexes는 각각 revelations[].revelationId, pressure.pressureId, funnel.funnelId, funnel.requiredPredicateIds, importantConsequenceIds를 가리킨다. 서버는 인덱스의 정수 유형·음수 여부·범위를 검사해 기존 DTO ID 필드로 변환한 뒤 기존 도메인 검증을 수행한다. pressureIndexes와 funnelIndexes는 각각 단일 대상 목록을 가리켜 항목 값 0만 허용하며 배열은 비어 있을 수 있다. 나머지 동적 목록의 범위 오류 진단은 고정 필드명과 허용 대상 개수만 포함한다. 각 상황의 intents 배열은 비지 않아야 하고 다섯 상황 인덱스 배열 중 하나 이상에는 대상이 있어야 한다. 다섯 개의 중첩 anyOf 분기는 전체 SituationDefinition 필드를 required로 명시하고 추가 필드를 금지하며, 각 분기에서 대상 인덱스 배열 하나만 비지 않도록 한다. 개별 대상 배열은 비어 있을 수 있고 intent별 대상 대응은 추가하지 않는다. mapDefinitionId는 해당 패키지에서 제공된 지도 식별자 문자열 중 하나 또는 null이다. 제공 지도가 없으면 null만 허용하며, 기존 상세 DTO UUID 필드와 지도 범위 검증을 유지한다. 초기 전체 준비의 각 상세 요청은 전체 검토 목록과 이전 단계에 이미 배정된 SOURCE_EXTRACTED 필수 상황 ID를 모두 받는다. 생성 지시는 이미 배정된 ID를 반복하지 않고 남은 검토 필수 항목만 원래 자료·관계·근거 그대로 배정하도록 한다. 단계별 누적과 전체 초기 세트 누락·중복 검증을 유지한다. intents와 선택된 하나 이상의 대상 배열을 제외한 선택 재료·상황 참조 배열은 비어 있을 수 있다. 문서·버전 조합과 정확한 locator는 기존 도메인 검증으로 확인한다.
    opening_situation_index: 비공개 상세 응답은 상황별 opening boolean 대신 최상위 openingSituationIndex를 반환한다. 첫 단계는 0 이상 정수 인덱스를 반드시 선택하고, 이후 단계는 인덱스 또는 null을 반환한다. 어댑터가 범위를 검증한 뒤 선택 항목에 기존 opening=true를 설정한다. null은 해당 단계에 시작 상황이 없음을 뜻하며 첫 단계의 기존 필수 조건과 저장·외부 DTO를 바꾸지 않는다.
    supplemented_situation_ids: required=false이고 provenance=GM_SUPPLEMENTED인 비공개 상황 ID는 단계 ID를 포함한 길이 접두사로 정규화하고 같은 응답의 선행 참조도 같은 정본 ID로 갱신한다. 검토된 필수 상황 ID·자료·근거·선행 관계는 그대로 보존한다. 보호 ID와 정규화 ID의 충돌 또는 중복된 보호 ID를 가리키는 모호한 참조는 거부한다. 전역 중복·선행 존재·순환 검증은 유지한다. 중복 진단에는 단계 ID, 출처 구분, 필수 여부만 담고 상황 ID·원문 문장은 담지 않는다.
    validation_boundary: 스키마는 JSON 모양만 제한한다. sourceRefIndexes는 해당 작업의 허용 목록 순서로 정본 참조를 복원하며 정정 응답 인덱스는 해당 허용 목록 범위를 따르고 기존 mapper가 한 번만 처리한다. 원문 내용·위치의 실제 대응, 제공 맵·상황 관계, 정정의 원본 항목 일대일 대응·ID 보존, 전체 결과 검증은 애플리케이션이 유지한다.
  preparation_retry: 같은 모험의 동일 준비 요청은 저장된 결과를 재사용한다. 준비 결과가 없는 경우에만 생성하고 동시 요청의 저장 충돌을 검증한다. 준비 단계의 여러 필수 자료는 함께 게시하여 일부 자료만 준비 완료로 노출하지 않는다.
  ingredients: 기존 상황 의도와 대상 참조를 활용하고 필수 여부·원문 선행 관계·원문 추출 또는 GM 보완의 구분·제공 맵 참조를 추가한다. 상세 사건 대본이나 일괄적인 추가 필수 요소는 만들지 않는다.
  ordering: 원문에 명시된 상황의 선행 관계를 참조로 검증한다. 기존 단계의 연속 순서만으로 원문에 없는 상황 순서를 강제하지 않는다.
  selection: GM 입력에 해당 모험의 준비된 핵심 요소·사용 상태·확정 사건을 전달하고 계속 진행·후보 선택·적합 후보 부재 시 새 상황 생성의 제안을 받는다.
  admission: 후보 식별자가 해당 모험에 속하는지, 선행 필수 상황과 확정 사건에 맞는지, 맵 참조가 제공 범위에 있는지 검증한 후 확정 대기 상태를 만든다.
  turn_commit: 기존 확정 대기 상태에 상황 진행 상태와 새 상황을 포함한다. 현재 상황·상황 사용 상태·새 상황 등록은 같은 모험 버전의 기존 턴 확정으로 저장한다. 별도 선행 저장으로 새 상황을 공개하지 않는다.
  pending_roll: 플레이어 굴림 대기 중에는 제안만 보존하며 상황의 사용이나 전환을 확정하지 않는다. 복원·재시도 때 동일 대기 제안을 이어받는다.
  provided_maps: 상황에 적합한 제공 맵 참조만 허용한다. 적합한 맵이 없으면 맵 없이 처리하며 다른 모험의 지도 실행 상태를 가져오지 않는다.
  grounding: 확인한 원문과 GM 보완을 구분한다. 근거 부족 자체로 준비를 중단하지 않되 원문 조회·추출·전체 단일 요청 대조 실패 또는 입력 한도 초과, AI 응답 형식 오류·출처 위조·검토 목록 누락·다른 모험 참조·원문 선후 관계 위반은 정상 보완으로 취급하지 않는다.
  compatibility: 기존 자료 자동 이관·호환성 유지·기존 형식의 복원 어댑터·기존 실행의 회귀 지원은 제외한다. 기존 자료를 삭제하지 않으며 신규 모험의 경로는 패키지 단위 공용 상황 자료로 되돌아가지 않는다. 새 형식에서의 재시작·굴림 대기·중복 요청 복구는 반드시 구현한다.
  recovery: 기존 턴의 소유권·버전·중복 요청·실패 저장 및 복구 절차를 유지한다. 실제 기술 실패를 새 상황 생성으로 우회하거나 준비 완료로 표시하지 않는다.
  observability: 기존 준비와 턴 단계 진단에 모험 식별자·선택한 상황 식별자·선택 또는 생성 구분·검증 결과를 기록한다. 미공개 스토리·원문·전체 프롬프트는 기록하지 않는다.
  verification: 구간별 추출이 놓친 상황·구간 간 관계를 전체 원문 구간과 전체 제안 목록을 한 요청에 넣은 직접 대조가 찾아 보완하는 경우, 최종 생성의 누락·근거 없는 관계를 게시 전에 거부하는 경우, 원문 조회·추출 실패 또는 검토 입력 한도 초과가 시작을 막는 경우, 잘못된 sourceRefs·prerequisiteSituationIds의 단일 정정 호출이 각 잘못된 항목과 순서·개수별로 1:1 대응하는 경우, 정수 인덱스의 유형·범위를 검사하고 원래 ID·summary를 복원하며 선택 입력 ID 불일치를 거부하는 경우, 기존 유효 항목을 보존하고 출처·선행 식별자·순환을 포함해 전체 재검증하는 경우, 정정 후에도 유효하지 않은 목록을 거부해 준비·시작을 막는 경우를 검증한다. #378 종단 간 검증은 새 정정 경로를 포함해 실제 시작을 통과할 때까지 미완료로 기록한다. 동일 패키지의 두 모험 분리, 동일 모험 재시도와 검토 목록 복원, 복수 후보, 후보 부재 생성, 출처 구분 보완, 맵 부재, 굴림 대기, 저장 실패와 재시작 복구도 검사한다.
