schema_version: 1
review_mode: Learning
proposal: ../architecture-proposal.yaml
result: ACCEPTED
scope: 모험별 초기 상황 준비·저장과 기존 턴에서의 상황 확정 계약
result_limit: 제안 검토 결과다. 구현 설계 명세의 완료, Principle 승인, 기존 자료 삭제 승인을 뜻하지 않는다.
material_use:
  used_new_materials:
    - material_id: MAT-01
      approval_record: material-approvals/MAT-01-use-approval.yaml
      source_ids: [LOCAL-SRC-02]
      claim_ids: [LOCAL-CLAIM-02]
      limit: 현재 작업 트리의 코드 구조를 읽은 내용이며 실행 검증 결과가 아니다. 자료 사용 승인은 설계 전체나 Principle 승인이 아니다.
checklist:
  requirements: R-01부터 R-09까지 제안에서 참조한다. 모험별 초기 준비와 단일 턴 확정 요구를 중심으로 검토 중이다.
  targets: ST-03, ST-04, ST-05를 참조한다. ST-01 응답 시간과 ST-02 저장량은 수치 근거가 없어 미확정이다.
  alternatives: 사용자는 기존 진행 중 모험의 자료를 그대로 두고 신규 준비부터 적용하는 범위를 선택했다.
  tradeoffs: 사용자는 개발용이므로 호환성을 고려하지 말고 진행하라고 설명했다. 기존 자료 삭제는 지시하지 않았다.
  evidence: 제안과 제품 요구 및 목표를 대조했다. MAT-01에 승인된 현재 저장소 구조는 패키지와 개정으로 상황 자료를 조회함을 보여준다. 실행 검증은 없고 승인된 Principle 및 영속 Evidence 참조도 없다.
  boundary: 사용자는 진행 중 모험의 기존 자료를 그대로 두기로 했다. 신규 준비부터 모험별 분리를 적용하는 범위이며, 기존 자료 삭제는 이 결정에 포함되지 않는다. 후보 선택·생성·현재 상황 변경은 기존 턴에서 함께 확정하도록 제안되어 있다.
  answered_objections: AR-01에 대해 사용자가 기존 자료 유지와 개발용이므로 호환성을 고려하지 말라는 이유를 말했다. 추가 설명을 요구하지 않는다.
objections:
  - id: AR-01
    status: resolved
    statement: 모험별 상황 분리는 사용자 요구다. 진행 중 모험의 기존 자료 적용 범위와 호환성 고려 여부가 미정이어서 확인했다.
    impact: '추론: 기존 자료를 옮기면 이관과 검증 비용이 생긴다. 옮기지 않으면 진행 중인 모험에는 이번 기능이 적용되지 않을 수 있어 적용 범위를 분명히 해야 한다.'
    user_claim_refs:
      - ref: ../specification-status.yaml#architecture.accepted_direction_user_answer
        answer: "ㅇ"
        scope: 기존 준비·저장 확장과 후보 선택·생성·현재 상황을 기존 턴에서 함께 확정하는 방향 동의
      - ref: ../specification-status.yaml#architecture.isolation_user_answer
        answer: "준비된 상황은 같은 시나리오를 사용하는 여러 모험이 공유 -> 애초에 공유하면 안됨"
        scope: 초기 상황 세트부터 모험별 독립
    requirement_refs: [R-09]
    product_scope_ref: ../product-spec.md#10-scope-and-non-goals
    target_refs: [ST-05]
    principle_refs: []
    evidence_refs: []
    approved_local_material_refs:
      - material_id: MAT-01
        approval_record: material-approvals/MAT-01-use-approval.yaml
        claims:
          - id: LOCAL-CLAIM-02
            location: src/adventure-service/src/main/java/com/dndmaster/adventure/domain/scenario/StageArtifactRepository.java:8
    unavailable_refs:
      - type: Principle
        reason: 프로젝트 조회 결과 적용 가능한 승인된 Principle이 0건이다. 이 티켓의 LOCAL 식별자를 Principle로 취급하지 않는다.
      - type: Evidence
        reason: 프로젝트 조회 결과 적용 가능한 영속 Evidence가 0건이다. MAT-01의 LOCAL-SRC/LOCAL-CLAIM은 이 티켓에서 승인된 읽기 자료이며 영속 Evidence가 아니다.
      - type: user_claim_id
        reason: 사용자 답변은 specification-status.yaml에 원문으로 보존되어 있으나 별도 Claim ID가 없다.
    question: 기존 진행 중인 모험의 자료를 그대로 두는 선택의 이유와, 그 모험에는 새 상황 기능이 적용되지 않을 수 있는 제약을 어떻게 감수할지 설명해 주세요.
    answer: "기존건 놔둬\n개발용이니까 그냥 호환성 생각하지 말고 하라고"
    rationale: 개발용이므로 호환성을 고려하지 말고 진행하라는 사용자 설명.
