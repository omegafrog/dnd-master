schema_version: 1
scope: 사용자가 승인한 기존 구조 확장·모험별 분리·단일 턴 확정 방향의 세부 구현 계약
authorization: 사용자가 개발용이므로 호환성을 고려하지 말고 진행하라고 지시했다. 기존 형식 지원과 이관은 제외하고 신규 경로를 완결한다.
interfaces:
  preparation: StageArtifactPreparationApplicationService.Result prepare(AdventureId adventureId, SessionId sessionId, UUID scenarioPackageId, StoryLength storyLength)
  backbone_read: Optional<StageBackbone> findBackbone(AdventureId adventureId, UUID scenarioPackageId, long revision)
  stage_read: Optional<DetailedStage> findDetailedStage(AdventureId adventureId, UUID scenarioPackageId, String stageId, long backboneRevision, long revision)
  initial_save: void saveInitialArtifacts(AdventureId adventureId, StageBackbone backbone, List<DetailedStage> detailedStages)
  preparation_result: 기존 Result와 단계별 생성·검증 경계를 재사용한다. prepare는 골격의 모든 단계를 시작 전에 순서대로 준비하고, 모두 검증된 경우 saveInitialArtifacts로 초기 자료 전체를 한 번에 게시한다. 실패 중에는 모험 시작을 허용하지 않으며, 저장된 완성 자료가 없으면 동일 모험 식별자로 초기 준비 전체를 다시 수행한다.
  generation: 기존 StageBackboneGenerationPort와 StageDetailedGenerationPort의 Request에 모험·세션 식별자를 전달하고 세션에 선택된 GM 실행 설정을 사용한다. 기존 generate(Request request) 호출 경계를 유지한다.
  runtime: 기존 계획 요청·응답과 확정 대기 상태를 확장한다. 기존 Adventure.commitRuntimeTurn 시그니처를 유지하고 확정 대기 상태에 담긴 모험별 상황 진행 상태를 함께 반영한다.
  signature_meaning: AdventureId는 모험 식별자, SessionId는 세션 식별자, StageBackbone은 모험 진행 골격, DetailedStage는 준비된 단계의 핵심 요소와 상황 목록, SituationDefinition은 준비된 상황 정의, Result는 준비 결과다. 코드 식별자는 기존 선언과 동일한 의미로 사용한다.
  preparation_flow:
  - 기존 시작 준비 요청에서 권한·세션 버전을 검사한 뒤 모험 식별자와 세션 생성 시 검증·저장된 StoryLength를 확보한다. 재시도면 세션에 고정된 식별자와 길이를 복원한다. 동일 세션의 동시 요청은 같은 모험만 소유할 수 있게 버전 조건부 갱신을 사용한다. 서버가 저장된 길이를 StageArtifactPreparationApplicationService.prepare(..., StoryLength storyLength)에 전달하며 클라이언트가 다시 지정한 값으로 덮어쓰지 않는다.
  - 재시작에도 같은 모험을 식별할 수 있도록 시작 준비의 식별자 예약을 먼저 저장한다. 원격 GM 생성 중에는 데이터베이스 트랜잭션을 열어 두지 않는다.
  - 해당 모험의 완성된 초기 상황 세트가 이미 있으면 반환한다. 조회는 반드시 모험과 원본 패키지·개정 범위를 함께 검사한다.
  - 선택된 STORYBOOK만 이야기 후보 검색에 사용한다. 검색된 후보만 제한된 수로 처리하며 원문 전체나 전체 색인 구간을 페이지 조회하지 않는다. 후보의 문서·추출 버전·위치가 선택 범위와 맞지 않으면 준비를 실패한다.
  - 제한된 RAG 후보 구간에서 한 번에 필수 상황과 명시된 선행 관계를 추출한다. 이 절차는 검색되지 않은 원문 상황의 누락을 찾거나 원문 전체의 완전성을 증명하지 않는다. 기본 RULEBOOK은 상황별 규칙 검색에만 사용하며, 필수 상황별 검색문을 묶어 임베딩한 뒤 dense 검색을 시작한다.
  - 골격의 모든 단계를 시작 전에 단계 순서대로 생성한다. 단계별 생성은 기존 prepareNext의 생성·검증 경계를 재사용하고, 각 단계에 해당하는 RAG 추출 필수 상황 목록을 입력으로 주어 모든 상황과 선행 관계를 반영했는지 확인한다. 이는 원문 전체 상황을 빠짐없이 찾았다는 보장이 아니다. 검증된 단계 결과는 모아 두었다가 전체 단계가 성공한 뒤 한 번에 게시한다.
  - 단계 순서는 생성 자료를 정리하는 순서로만 사용한다. 상황의 실행 순서는 원문에 명시된 선행 관계만 제한하며, 단계 번호로 추가 순서를 만들지 않는다.
  - 추출 목록과 해당 호출에서 생성된 필수 상황이 정확히 대응하고, 목록 각 항목의 sourceRefs가 검색에서 허용한 위치와 일치하며, 선행 관계·출처 구분·제공 맵 범위가 유효한지 검증한다. 단계별 후보 개수에는 상한을 두지 않으며 전체 모험에서 현재 선택 가능한 후보를 턴 문맥 JSON으로 직렬화한 UTF-8 크기는 8,192 byte 이하여야 한다. 초과 응답은 직전 JSON을 한 차례 보정 요청에 재사용하고 보정 위치·개수·byte 초과량을 지정한다. 필수 상황을 보존하고 중간 후보 수는 줄일 수 있다. 재초과하면 전체 초기 자료를 게시하지 않으며 진단에 JSON 원문을 남기지 않는다. 전체 단계가 유효할 때만 기존 초기 자료 저장 경계에서 함께 게시한다. 부분 준비 결과는 저장하지 않는다. 준비 재시작은 같은 모험 ID로 전체 단계 생성을 다시 수행한다. 동일 모험의 저장 경쟁에서는 이미 게시된 완성 자료를 반환한다.
  - 제공된 맵 연결 자료를 해당 모험의 준비에 전달하고 시작 장면을 선택한다. 상황 준비가 실패하면 모험을 시작 완료로 표시하지 않고 같은 모험의 준비 재시도를 허용한다.
  - 같은 모험의 제공 지도 목록에서 연결 대상과 원본 이미지 개정(`imageRevision`, 원본 맵 이미지 표현의 SHA-256 값)이 같은 지도를 찾고 그 저장 정렬을 조회한다. 동일 파일에 저장 정렬이 있으면 사용자에게 저장 정렬 재사용 또는 직접 수정을 먼저 묻는다. 재사용은 원본 지도 `mapId`의 정렬을 바꾸지 않고 저장된 격자 원점·칸 크기를 대상 지도 `mapId`의 기존 정렬 저장 경계로 적용한다. 직접 수정은 대상 지도에서 기존 편집기와 저장 경계를 사용한다. 선택 전에는 맵 준비를 완료 처리하지 않는다. 일치하는 파일이나 저장 정렬이 없으면 기존 격자 준비 흐름만 사용한다.
story_rag_candidates: 검색 결과 수를 제한하고 소유자·모험·문서·추출 버전·위치 범위를 확인한다. 중복 위치는 한 건으로 합치고, 후보 발췌 길이를 제한한다. 추출 목록의 식별자 고유성, 인용 위치 허용 범위, 선행 식별자 존재 및 순환 여부를 검증한다. 이는 RAG가 찾지 못한 원문 상황의 누락이나 원문 전체의 완전성을 증명하지 않는다.
bounded_situation_extraction: 모험 준비의 STORYBOOK 검색은 한 번만 수행하고, 제한된 발췌와 같은 검색 결과의 위치 참조를 함께 추출 요청에 전달한다. 다음 단계 준비는 저장된 참조를 사용해 STORYBOOK을 재검색하지 않는다. 후보만 한 번의 구조화된 JSON 추출 요청에 전달한다. 원문 전체 재검토·후보별 재검토·정정 호출은 하지 않는다. 출처 허용 범위와 식별자·선행 관계 검증에 실패하면 준비 실패다. 검색 누락에 대한 완전성 주장은 하지 않는다.
preparation_query_embeddings: STORYBOOK 검색문은 STORYBOOK 문서만, 필수 상황별 규칙 검색문은 RULEBOOK 문서만 허용한다. 각 역할의 검색문 전체를 묶음 임베딩한 뒤 검색하며, 한 검색 결과를 다른 문서 유형의 근거로 사용하지 않는다.
initial_situation_json_schemas:
  transport: InitialSituationGmPort.Request는 필수 객체 outputSchema를 가지며 HTTP 내부 요청부터 TypedAgentContractController·GmCompletionAdapter·GmCompletionRouter를 거쳐 Codex AiExecutionRequest.outputSchema로 전달한다. 출력 형식은 JSON이다. 요청 생성자는 type=object, properties 객체, required 배열, additionalProperties=false를 강제한다. 이 전용 경로를 제외한 기존 Provider 요청·검증 방식은 유지한다.
  common: 세 응답 스키마(상황 추출·골격·상세)의 모든 객체는 허용 properties를 명시하고 전체 required 필드와 additionalProperties=false를 지정한다. 응답은 source-reference 객체 대신 해당 요청의 서버가 부여한 허용 sourceRefIds 목록 중 허용 ID 배열을 사용한다. 서버는 선택한 ID가 서버 제공 허용 목록에 있는지 검사한다. 허용 목록이 비면 maxItems=0이며 중복 ID는 기존 List 동작대로 허용한다. 추출은 허용 참조가 있을 때 sourceRefIds 하나 이상을 요구한다.
  required_extract: requiredSituations 항목은 summary, prerequisiteSummaries, sourceRefIds, isEnding을 가진다. 모델은 상황 ID·선행 ID·배열 인덱스를 반환하지 않는다. 선행 요약은 추출 목록의 유일한 summary와 정확히 일치해야 하며 서버가 이를 모험별 ID 관계로 변환한다. 서버가 모험별 필수 상황 ID를 부여한다. 인용 위치는 허용 목록에서 변환한다.
  backbone: stages 배열 순서는 준비 자료 나열 순서다. 항목은 role, coreProblem, funnelSummary, requiredSituationSummaries, sourceRefIds를 반환하고 서버가 단계 순서와 ID를 부여한다. stageId와 상황 인덱스는 모델 응답에서 금지한다. 필수 상황 요약은 추출된 유일한 summary와 정확히 일치해야 하며 서버가 ID 관계를 복원한다. 단계 배열 순서로 플레이 순서를 제한하지 않는다.
  detailed_stage: 응답은 요청의 필수 상황 순서와 정확히 같은 requiredSituationDetails 목록 및 0개 이상 intermediateSituationCandidates 목록으로 나눈다. requiredSituationDetails의 수가 요청한 필수 상황 수와 같을 때만 서버가 순서대로 각 필수 상황 ID를 연결한다. 상황 ID나 positional index를 응답에 넣지 않는다. 이름 title과 장면 설명 description은 공백 제거 후 비어 있지 않고 각각 120·2000 Unicode 코드 포인트 이내다. 필수 상황 detail의 opening boolean은 첫 단계에서 정확히 하나만 true이며 이후 단계에서는 모두 false다. 모든 출처·지도·필수 선행 관계는 서버 정본에서 복원한다. 단계별 후보 최소 개수는 강제하지 않는다. 애플리케이션은 단계의 전체 선택 가능 후보 문맥을 UTF-8 JSON으로 직렬화한 크기가 8,192 byte 이하인지 검사한다. 후보 수 자체는 제한하지 않으며 필수 상황 전체 목록에 byte 한도를 Schema maxItems로 바꾸어 적용하지 않는다. 의미상 장면 적합성은 프롬프트와 실제 모델 검증으로 확인하며 형식 검사만으로 보장하지 않는다.
  opening_situation: 응답의 requiredSituationDetails 각 항목은 opening boolean을 가진다. 서버는 첫 단계에서 정확히 하나가 true이고 이후 단계에서 모두 false인지 검증한 뒤 기존 opening=true를 설정한다. 위치 인덱스를 요청하거나 응답하지 않는다. 초기 자료 게시 전과 실제 모험 시작 시 opening의 미완료 필수 선행 상황을 별도로 검사한다. 새 모험에서는 선행 필수 상황이 있는 필수 opening을 거부한다. 기존 저장·외부 DTO는 유지한다.
  supplemented_situation_ids: GM 보완 상황의 ID는 서버가 부여하며 응답에 상황 ID·필수 상황 positional index·선행 ID를 받지 않는다. 필수 상황 상세는 요청 목록과 같은 순서·같은 개수로 돌려받고 서버가 정본 ID·원문 근거·선행 관계를 복원한다. 선택 상황은 별도 선행 관계를 만들지 않는다.
  domain_validation: 스키마로 보장되지 않는 원문 위치·제공 맵·상황 관계·요구 항목 전체 배정은 애플리케이션에서 검증한다. 모든 내부 ID는 서버가 부여한다. 잘못된 참조 진단에는 필드와 허용 ID 목록 크기만 포함한다. 유효하지 않은 응답은 저장 전에 거부한다.
required_situation_contract: "`RequiredSituation(situationId, summary, prerequisiteSituationIds, sourceRefs, isEnding)`는 RAG 후보에서 추출한 필수 상황과 출처를 나타내며 `StageBackbone.requiredSituations`에 보관한다. 각 추출 항목은 정확히 연결되는 최종 필수 `SituationDefinition` 및 동일한 `SOURCE_EXTRACTED` 위치와 선행 ID, 명시적 ending 여부를 가져야 한다. 추가·누락 위치, 필수 상황·관계 누락, 출처 불일치, 원문에 없는 관계는 게시 전에 거부한다. 관계는 stageId 배치와 무관하게 전체 초기 상황 ID 집합에서 존재 여부·자기 참조·중복·순환·단일 루트·명시적 결말 하나 이상·모든 비결말에서 결말 도달·결말 후속 없음 조건을 검증한다. 초기 opening은 미완료 필수 선행 상황을 건너뛸 수 없으며, 이를 준비 게시와 실제 시작 경계에서 검증한다. StageBackbone.order나 상황이 속한 단계로 플레이 순서를 추가하지 않는다."
storage:
  source: 추가 룰북 및 원문 위치는 기존 패키지·추출 개정 참조를 사용한다. 원문이나 맵 파일을 복제하는 기능을 추가하지 않는다.
  initial: 기존 StageArtifactRepository와 PostgresStageArtifactRepository의 모험 식별자를 포함한 JSONB 저장·조회 경계를 사용한다. StageBackbone과 DetailedStage를 기존 저장 operation으로 한 번에 게시하고 기존 키·버전 검사를 유지한다. 새 테이블·마이그레이션은 추가하지 않는다. 기존 준비 자료는 삭제·이관하지 않으며, 신규 모험의 새 형식 저장 시 이전 자료를 재사용하거나 읽는 호환 경로는 만들지 않는다.
  reservation: 준비 자료 저장 전에 해당 모험이 존재하거나 세션이 그 모험을 예약한 상태인지 검증한다. 외래키를 만들면 예약 시점에 참조 행을 먼저 저장하는 실제 호출 순서와 맞춘다.
  prepared_immutability: 게시된 초기 상황 정의는 모험별 준비 개정의 불변 자료다. 다른 모험의 자료를 동일 결과로 캐시하거나 공유하지 않는다.
  generated: 플레이 중 턴 응답으로 준비되지 않은 새 상황을 생성·확정하지 않는다. StoryRuntimeState는 이야기 길이와 선택 상황 허용량·사용량, 필수 상황 진행 상태, 현재 활성 준비 상황을 보존한다. 초기 게시된 상황 정의와 원본 패키지는 수정하지 않는다.
  stage_references: 준비 자료 나열용 stageId와 각 상황의 소속 stageId는 보존한다. StoryRuntimeState는 모험의 모든 단계에 속한 상황 사용 상태를 하나의 모험 범위에서 추적하고, 단계별 공개·압박·핵심 요소 진행은 stageId별 진행 상태에 보존한다. 다음 상황은 현재 단계 여부와 무관하게 전체 선택 가능 집합에서 고르며 원문 선행 관계만 후보 적격성을 제한한다. 선택된 상황의 stageId로 현재 단계 문맥을 바꾼다. StageBackbone.order 또는 order + 1은 실행 가능성에 영향을 주지 않는다.
  json: PostgresAdventureRepository와 PostgresRuntimeTurnRepository에서 신규 JSON을 저장·복원한다. 이전 JSON의 누락 필드를 메우는 호환성 생성자나 변환 어댑터를 추가하지 않는다.
  protection: 기존 자료의 삭제와 기존 모험의 일괄 재생성은 하지 않는다. 새 형식의 저장·재시작·중복 처리 검증은 호환성 제외와 무관하게 필수다.
situation_semantics:
  required: 필수 상황인지 중간 후보인지 구분한다. 원문에 없는 필수 사건을 임의로 원문 추출이라고 표시하지 않는다.
  prerequisites: 원문에 명시된 선행 상황만 식별자 목록으로 저장한다. 없는 식별자·자기 참조·중복·순환 참조를 거부한다. 관계는 상황이 속한 단계와 무관하게 전체 모험 범위에서 검사한다. 목록이 비어 있거나 검토되지 않은 후보 관계에는 임의 선후 제약을 추가하지 않는다.
  ingredients: 기존 상황 의도와 정보·압박·다음 진행 조건·중요 결과 참조를 재사용한다. 필요한 핵심 요소만 채우고 상세 대본을 준비하지 않는다.
  provenance: 원문 추출 항목은 원문 위치를 보존하고 GM 보완 항목은 보완임을 명시해 원문에서 확인된 내용과 구분한다. 허위 출처를 허용하지 않는다.
  map: 제공 맵의 식별자 또는 맵 없음으로 표현한다. GM이 연결을 제안해도 해당 모험의 제공 맵 범위 안인지 검증한다.
turn_flow:
  - 현재 상황 계속 진행인지 전환이 필요한지 GM이 플레이 행동과 확정 사건으로 판단한다. 매 턴 새 상황을 강제로 생성하지 않는다.
  - 상황 종료 시 같은 단계의 자연스러운 선택 상황을 허용량 안에서 우선 고려하고, 그 외에는 전체 그래프에서 모든 선행 상황이 사용된 미사용 필수 상황을 제안한다. 적격 후보가 없으면 새 상황을 만들지 않고 진행을 거부한다.
  - 원문 필수 상황·선행 관계·확정 사건·모험 소유권·공개 범위와 제공 맵 참조를 검증한다. 턴 응답의 임의 새 상황 전환은 거부한다.
  - 적격 준비 상황 선택 시 원문 그래프 선행 관계에 따라 해당 필수 노드를 활성화한다. CONTINUE는 현재 상황을 유지한다. 임의 새 상황 전환은 거부한다.
  - 검증된 상황 진행, 선택 상황 사용량 및 ending 완료 여부를 PendingRuntimeState에 보존한다. 플레이어 굴림은 기존 대기 절차로 처리하며 해당 턴이 확정되기 전에는 상황 진행이나 사용량을 바꾸지 않는다.
  - 해당 모험 버전과 턴 식별자로 현재 상황·전체 그래프 진행 상태·이야기 길이 사용량·게임 결과를 기존 턴의 한 번의 확정에 반영한다. 명시적 ending 선택은 같은 확정에서 모험 완료를 저장한다. 중복 제출은 기존 확정 결과를 반환하고 다른 모험의 진행 상태를 읽거나 수정하지 않는다.
failure_contracts:
  source_insufficient: 정상적인 GM 보완과 출처 구분으로 준비를 계속한다.
  invalid_generation: RAG 추출에서 허용되지 않은 sourceRefIds, 정확히 대응되지 않거나 중복된 선행 summary, 자기 참조 또는 순환이 있으면 준비를 실패시킨다. 골격 summary가 추출 목록에 정확히 대응하지 않거나 상세 필수 목록의 수·순서가 요청과 다르면 실패시킨다. ID는 서버에서 부여되므로 모델 생성 ID의 중복 검증은 하지 않는다. 자동 정정 호출은 하지 않으며 RAG 검색 누락은 감지할 수 없다.
  provider_failure: 기존 AI 요청의 제한·분류·재시도 정책을 사용한다. 호출 실패를 근거 부족이나 완성된 상황으로 바꾸지 않는다.
  storage_conflict: 동일 모험의 완성 결과를 조회하거나 현재 버전 충돌을 반환한다. 다른 모험 자료로 대체하지 않는다.
  pending_or_commit_failure: 확정 대기 제안을 보존하고 기존 턴 재개 절차를 사용한다. 실패한 턴의 선택·사용·새 현재 장면이 확정 상태로 나타나지 않게 한다.
  map_absent: 적합한 제공 맵이 없으면 맵 없이 서술·판정으로 진행한다. 제공되지 않은 맵이나 연결 통로를 생성하지 않는다.
scope:
  existing_entrypoints: AdventureSessionApplicationService와 AdventureStartApplicationService 모두 모험 소유 키를 전달한다. 실제 UI가 호출하는 시작 전 준비 경로와 최종 시작 경로를 함께 변경한다.
  existing_components: StageArtifactPreparationApplicationService, 기존 생성 포트와 실제 GM 어댑터 연결, StageArtifactRepository와 PostgreSQL 구현, 단계 전환 및 StoryRuntimeRules, RuntimeTurnApplicationService와 프롬프트·응답 변환, PendingRuntimeState, Adventure, 저장소, AdventureApiConfiguration을 변경한다.
  frontend: 기존 준비 및 시작 응답 계약을 유지한다. 별도 시나리오 편집 화면·새 공개 엔드포인트·새 배포 서비스는 만들지 않는다. 제공 맵 없는 상황을 시작할 수 있어야 한다.
  tests: 기존 생성자·요청·저장 호출의 테스트 자료를 신규 계약으로 갱신하고 실제 Bean 연결의 복수 상황 생성, 두 모험 분리, 전체 단계 준비 재시도, 상황 선행 관계, 선택과 생성, 굴림 대기, 제공 맵 없음, 신규 상태 재시작을 검증한다. RAG 후보 범위, JSON schema 적용, 고유 식별자, 출처 위치, 선행 관계와 순환 오류 시 준비 실패도 확인한다. RAG 검색 누락의 완전성은 테스트 통과 조건으로 주장하지 않는다. #378 종단 간 확인은 실제 모험 시작까지의 통과 여부를 별도로 기록한다.
  excluded: 기존 모험의 이관·호환성 어댑터·이전 형식 회귀 지원·지도 생성·계획 전체 공개·새 서비스·상황 편집 UI는 제외한다. 동일 맵 파일의 격자 선택은 기존 준비 화면과 지도 편집 경계를 사용하며 별도 화면이나 저장 경계를 만들지 않는다.
coverage:
  design_scope: 제품 UC-1부터 UC-3 및 R-01부터 R-10을 준비·선택·생성·단일 확정 계약에 대응한다.
  domain_flow: 명령·후보·검증·준비 게시·상황 계속 또는 전환·턴 확정의 소유권과 조건을 위 흐름으로 정의했다.
  boundaries: 사용자가 승인한 기존 준비와 모험 실행 책임 내부 확장이다. 별도 책임 영역·모듈·배포 경계를 승격하지 않는다.
  ownership: 초기 자료는 모험별 준비 저장소, 플레이 변화는 해당 모험 상태, 원문과 맵 원본은 기존 소유자가 관리한다.
  types: RAG에서 추출한 결과는 기존 모험 소유 StageBackbone JSON에 저장하고, RequiredSituation은 필수 상황 식별자·요약·선행 식별자·위치 참조를 담는다. 별도 공유 정본은 만들지 않는다. 기존 상황과 단계 정의에는 제품의 필수 여부·선행 관계·출처 구분·제공 맵 참조를 반영한다.
  state_and_repository: 안정적인 모험 식별자 예약·모험 소유 키·기존 단계별 초기 자료 저장·준비 후보 사용 상태·현재 장면·단일 턴 확정을 정의했다.
  program: 기존 포트의 구체 시그니처와 생성 입력·결과·실제 호출부 변경을 정의했다.
  technical: 기존 서비스와 PostgreSQL을 사용한다. 내부 요청과 JSON만 변경하고 호환성 어댑터를 추가하지 않는다.
  runtime: 모험별 버전과 턴 식별자, 준비 자료의 유일성, 생성 호출 밖의 짧은 저장 트랜잭션, 대기 후 단일 확정을 사용한다.
  recovery: 원문 조회·완전성·대조 실패, 정상 근거 부족, AI 오류·참조 오류·목록 불일치·저장 경쟁·굴림 대기·턴 확정 실패를 구분하고 기존 제한된 복구 절차를 사용한다. 단계 생성 실패는 전체 준비 미완성으로 처리하며 모험 시작을 막는다. 임시 결과는 저장하지 않으므로 같은 모험 식별자로 전체 초기 준비를 다시 수행한다. 모든 단계가 검증된 뒤 기존 초기 자료 JSONB 경계에서 한 번에 게시한다. AI 보정 호출은 직전 생성 JSON과 보정 대상 위치·byte 초과량을 요청 입력으로 사용한다. 진단에는 원문을 남기지 않는다.
  security_and_observability: 모험 소유권·원문 범위·제공 맵·공개 여부·AI 제안을 검증한다. 기존 단계 진단만 확장하고 원문과 비공개 서술은 기록하지 않는다.
  change_and_verification: 실제 준비·시작 두 경로와 신규 저장 계약·턴 저장·테스트 자료를 함께 변경하고 신규 기능과 신규 상태의 실패 복구를 검증한다.
  tradeoffs: 모험별 독립 생성으로 생성량과 저장량이 늘어난다. 공유 최적화는 R-09에 반하므로 적용하지 않는다. 개발용이라는 사용자 지시로 기존 형식 유지 비용은 제외한다. 수치 목표는 미확정으로 남겨 근거 없이 만들지 않는다.
completion:
  authorization: 사용자 개발용이니까 그냥 호환성 생각하지 말고 하라고 지시에 따라 확정된 방향과 범위의 명세 작성을 진행한다. 동일 호환성 확인이나 추가 형식 승인 질문을 반복하지 않는다.
  blocking_questions: []
diagrams:
  - diagrams/architecture/situations.class.svg
  - diagrams/architecture/turn-commit.state.svg

scene_content_amendment:
  authorization: request.md의 두 작업 및 단계별 최소 후보 개수 검증 제거 제안을 사용자가 ㅇㅇ으로 승인했다.
  status: accepted-target
  generation: 기존 StageDetailedGenerationPort.Request에 단계의 문제·연결 요약과 같은 준비 요청에서 얻은 관련 storyPassages를 담는다. 발췌는 허용 출처를 확인한 뒤 합계 2000 Unicode 코드 포인트로 제한한다. 다음 단계·재시작에는 저장된 필수 요약과 단계 맥락을 사용하며 새 STORYBOOK 검색과 영속 발췌 캐시를 추가하지 않는다.
  domain: SituationDefinition의 title·description은 필수다. 기존 intents·대상 참조·필수 여부·선행·출처·지도 필드는 보존한다. 생성 schema·materializer·도메인 생성자·모든 생성 호출과 fixture를 함께 갱신한다.
  candidate_count: openingSituationRequired와 필수 상황 검증은 유지한다. schema의 requiredSituations 수에 더하는 두 후보 조건, 호출 프롬프트와 detailedPrompt, validatePreparedStage 및 validateInitialSituationSet의 중간 후보 최소 개수 검사를 제거한다. 단계별 0·1·여러 후보를 개수만으로 거부하지 않으며 전체 검사에서 같은 고정 최소 규칙을 되살리지 않는다.
  required_graph: 원문에서 확인한 필수 선행 관계는 그래프로 저장한다. 시작 상황은 하나여야 하며, 원문에 명시된 선행 관계만 허용한다. 복수 선행 관계와 합류를 허용하고, 임의 부모·가상 루트나 중간 후보 선행 관계로 보정하지 않는다. 끝 상황은 명시적으로 하나 이상 있어야 하며, 끝 아닌 모든 상황에서 끝 상황에 도달할 수 있어야 하고, 끝 상황에는 후속 관계가 없어야 하며, 그래프는 비순환이어야 한다. 조건을 만족하지 못하면 준비 실패다.
  persistence: 기존 DetailedStage JSONB 저장·조회로 이름과 설명을 보존하고 실제 저장소 왕복과 신규 형식 재시작에서 확인한다. 기존 자료 삭제·일괄 재생성·이관·호환 어댑터는 추가하지 않는다.
  runtime: RuntimeTurnApplicationService.situationSelectionContext가 모든 단계의 선택 가능한 후보 ID·title·description·의도·사용 상태를 전달하고, CurrentSituation과 activeSituationId를 다른 뜻으로 설명한다. RuntimeGmInputBudget의 80% 입력 한도 안에서 고정 지침·잠긴 자료 최대 40%, 장기 기록 최대 10%, 압축 대화 최대 15%, 압축하지 않은 최근 대화 최대 20%를 각각 검사하며 최신 문맥은 실제 잔여 byte를 사용한다. 선택 가능 후보 전체의 턴 문맥 JSON 직렬화 크기는 8,192 UTF-8 byte로 제한하며 후보 개수 자체에는 상한을 두지 않는다. 후보를 잘라내거나 생략하지 않으며 한도를 넘으면 구역별 기대/실제 byte 수를 진단하고 기존 InputTooLargeException으로 AI 호출 전에 실패한다. 같은 입력은 재시도하지 않으며 선택 모델 용량이나 현재 턴 입력이 바뀐 뒤에만 재개한다. TRANSITION 응답은 적격 selectedSituationId만 허용하고 newSituation은 거부한다. CONTINUE에서는 상황 선택 필드를 거부한다. 필수 후보는 UNUSED이며 모든 명시적 선행 노드가 USED인 경우에만 선택할 수 있고 이미 사용한 필수 상황 재선택은 거부한다. 선택 상황은 같은 단계·자연스러운 사건 연결·허용량 잔여 조건을 모두 충족해야 한다. 새 장면 전환은 허용하지 않는다. 선택된 명시적 ending이 종료되면 후보 조회 없이 완료 상태를 기존 턴 확정 경계에서 함께 저장한다. PendingRuntimeState에는 검증된 이야기 진행 상태를 대기하며 굴림 대기·검증·저장 실패에서는 적용하지 않는다.
  diagnostics: 기존 DevelopmentDiagnostics 및 dev_ 형식을 사용하고 ADVENTURE_RUNTIME_DIAGNOSTICS_ENABLED일 때만 상세 로그를 남긴다. 시작·완료·실패·보정 재시도·복구에서 모험·단계 식별자, 후보 수, 기대/실제 byte, 시도 번호, 선택 분기, 소요 시간, 결과·실패 종류와 다음 복구를 기록하며 원문·프롬프트·응답 전문과 인증 정보는 남기지 않는다.
  verification: 스키마와 DTO 계약, 단계별 0·1·여러 후보, 필수·시작·출처 실패, 필수 opening의 미완료 선행 상황에 대한 게시·실제 모험 시작 거부 및 실패 후 시작 상태·현재 상황 미저장, 저장 왕복, 런타임 제목·내용 전달, 각 입력 구역의 한도·실제 byte 수, 후보 문맥 8,192-byte 경계, 초과 보정 1회와 재초과 게시 거부, 적격 후보 선택·현재 상황 계속·ending 완료·후보 부재 거부 분기, 서버 ID 부여, 굴림 대기·검증/저장 실패 후 미등록, 버전·모험 격리를 검사한다. 실제 E2E는 개별 Markdown을 따라 headed Chromium에서 진행한다. CUA Driver는 쓰지 않고 GM 응답을 자동화하지 않는다. 기존 추출 결과와 같은 맵의 사용자 격자를 활용하고 동일 맵 파일의 격자 재사용·직접 수정 선택을 따른다.
  performance: 추가 STORYBOOK 검색 0회 및 정상 경로의 단계별 생성 호출 수 유지를 검증한다. 후보 문맥 초과 때만 보정 요청을 단계당 최대 한 번 허용한다. 수치 지연·품질 개선은 아직 측정하지 않았으며 임의 목표를 만들지 않는다.
  lifecycle_scope: 전체 초기 단계 선준비는 현재 구현되어 있다. 이번 설계 변경은 전 단계 후보 선택, 단계 순서와 무관한 원문 관계 검증, 새 장면과 활성 준비 상황의 구분을 다룬다. 현재 코드 기준 문서는 구현된 동작과 남은 차이를 구분한다.
