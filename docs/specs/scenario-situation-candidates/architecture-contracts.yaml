schema_version: 1
scope: 사용자가 승인한 기존 구조 확장·모험별 분리·단일 턴 확정 방향의 세부 구현 계약
authorization: 사용자가 개발용이므로 호환성을 고려하지 말고 진행하라고 지시했다. 기존 형식 지원과 이관은 제외하고 신규 경로를 완결한다.
interfaces:
  preparation: StageArtifactPreparationApplicationService.Result prepare(AdventureId adventureId, SessionId sessionId, UUID scenarioPackageId)
  backbone_read: Optional<StageBackbone> findBackbone(AdventureId adventureId, UUID scenarioPackageId, long revision)
  stage_read: Optional<DetailedStage> findDetailedStage(AdventureId adventureId, UUID scenarioPackageId, String stageId, long backboneRevision, long revision)
  initial_save: void saveInitialArtifacts(AdventureId adventureId, StageBackbone backbone, List<DetailedStage> detailedStages)
  preparation_result: 기존 Result에 준비된 전체 DetailedStage 목록을 포함하고 기존 currentStage와 openingSituation을 시작 입력으로 유지한다.
  generation: 기존 StageBackboneGenerationPort와 StageDetailedGenerationPort의 Request에 모험·세션 식별자를 전달하고 세션에 선택된 GM 실행 설정을 사용한다. 기존 generate(Request request) 호출 경계를 유지한다.
  runtime: 기존 계획 요청·응답과 확정 대기 상태를 확장한다. 기존 Adventure.commitRuntimeTurn 시그니처를 유지하고 확정 대기 상태에 담긴 모험별 상황 진행 상태를 함께 반영한다.
  signature_meaning: AdventureId는 모험 식별자, SessionId는 세션 식별자, StageBackbone은 모험 진행 골격, DetailedStage는 준비된 단계의 핵심 요소와 상황 목록, SituationDefinition은 준비된 상황 정의, Result는 준비 결과다. 코드 식별자는 기존 선언과 동일한 의미로 사용한다.
preparation_flow:
  - 기존 시작 준비 요청에서 권한·세션 버전을 검사한 뒤 모험 식별자를 안정적으로 확보한다. 재개 요청이면 세션에 고정된 식별자를 복원한다. 동일 세션의 동시 요청은 같은 모험만 소유할 수 있게 버전 조건부 갱신을 사용한다.
  - 재시작에도 같은 모험을 식별할 수 있도록 시작 준비의 식별자 예약을 먼저 저장한다. 원격 GM 생성 중에는 데이터베이스 트랜잭션을 열어 두지 않는다.
  - 해당 모험의 완성된 초기 상황 세트가 이미 있으면 반환한다. 조회는 반드시 모험과 원본 패키지·개정 범위를 함께 검사한다.
  - 선택된 STORYBOOK만 이야기 후보 검색에 사용한다. 검색된 후보만 제한된 수로 처리하며 원문 전체나 전체 색인 구간을 페이지 조회하지 않는다. 후보의 문서·추출 버전·위치가 선택 범위와 맞지 않으면 준비를 실패한다.
  - 제한된 RAG 후보 구간에서 한 번에 필수 상황과 명시된 선행 관계를 추출한다. 이 절차는 검색되지 않은 원문 상황의 누락을 찾거나 원문 전체의 완전성을 증명하지 않는다. 기본 RULEBOOK은 상황별 규칙 검색에만 사용하며, 필수 상황별 검색문을 묶어 임베딩한 뒤 dense 검색을 시작한다.
  - 모든 단계의 핵심 요소와 초기 후보를 시작 전에 준비한다. 각 단계 생성은 RAG 후보에서 추출된 필수 상황 목록을 입력으로 받고 최종 자료가 그 목록의 모든 상황과 선행 관계를 반영하는지 검증한다. 이는 원문 전체의 상황을 빠짐없이 찾았다는 보장이 아니다.
  - 단계 순서는 생성 자료를 정리하는 순서로 사용한다. 상황 선택의 선행 제약을 단계의 연속 순서로 대신하지 않는다. 실행 가능한 다음 상황은 원문에 명시된 상황 선행 관계로 판단한다.
  - 추출 목록과 생성된 필수 상황이 정확히 대응하고, 목록 각 항목의 sourceRefs가 검색에서 허용한 위치와 일치하며, 선행 관계·출처 구분·제공 맵 범위가 유효한지 검증한다. 검증된 뒤에만 골격과 전체 단계 자료를 하나의 저장 트랜잭션으로 게시한다. 동일 모험의 저장 경쟁에서는 이미 완성된 결과를 반환한다.
  - 제공된 맵 연결 자료를 해당 모험의 준비에 전달하고 시작 장면을 선택한다. 상황 준비가 실패하면 모험을 시작 완료로 표시하지 않고 같은 모험의 준비 재시도를 허용한다.
story_rag_candidates: 검색 결과 수를 제한하고 소유자·모험·문서·추출 버전·위치 범위를 확인한다. 중복 위치는 한 건으로 합치고, 후보 발췌 길이를 제한한다. 추출 목록의 식별자 고유성, 인용 위치 허용 범위, 선행 식별자 존재 및 순환 여부를 검증한다. 이는 RAG가 찾지 못한 원문 상황의 누락이나 원문 전체의 완전성을 증명하지 않는다.
bounded_situation_extraction: 모험 준비의 STORYBOOK 검색은 한 번만 수행하고, 제한된 발췌와 같은 검색 결과의 위치 참조를 함께 추출 요청에 전달한다. 다음 단계 준비는 저장된 참조를 사용해 STORYBOOK을 재검색하지 않는다. 후보만 한 번의 구조화된 JSON 추출 요청에 전달한다. 원문 전체 재검토·후보별 재검토·정정 호출은 하지 않는다. 출처 허용 범위와 식별자·선행 관계 검증에 실패하면 준비 실패다. 검색 누락에 대한 완전성 주장은 하지 않는다.
preparation_query_embeddings: STORYBOOK 검색문은 STORYBOOK 문서만, 필수 상황별 규칙 검색문은 RULEBOOK 문서만 허용한다. 각 역할의 검색문 전체를 묶음 임베딩한 뒤 검색하며, 한 검색 결과를 다른 문서 유형의 근거로 사용하지 않는다.
initial_situation_json_schemas:
  transport: InitialSituationGmPort.Request는 필수 객체 outputSchema를 가지며 HTTP 내부 요청부터 TypedAgentContractController·GmCompletionAdapter·GmCompletionRouter를 거쳐 Codex AiExecutionRequest.outputSchema로 전달한다. 출력 형식은 JSON이다. 요청 생성자는 type=object, properties 객체, required 배열, additionalProperties=false를 강제한다. 이 전용 경로를 제외한 기존 Provider 요청·검증 방식은 유지한다.
  common: 세 응답 스키마(상황 추출·골격·상세)의 모든 객체는 허용 properties를 명시하고 전체 required 필드와 additionalProperties=false를 지정한다. 응답은 source-reference 객체 대신 해당 요청의 NUMBERED_ALLOWED_SOURCE_REFS 목록을 가리키는 sourceRefIndexes 정수 배열을 사용한다. 서버는 인덱스의 정수 유형·음수·범위를 검사하고 정본 참조로 변환한다. 허용 목록이 비면 maxItems=0이며 중복 인덱스는 기존 List 동작대로 허용한다. 추출은 허용 참조가 있을 때 sourceRefIndexes 하나 이상을 요구한다.
  required_extract: 최상위 requiredSituations 배열. 항목은 situationId, summary, prerequisiteSituationIds, sourceRefIndexes를 요구한다. 추출 작업의 번호 매긴 원문 위치 참조 목록 인덱스이며 허용 참조가 있을 때 하나 이상이어야 한다. 서버가 기존 RequiredSituation.sourceRefs로 변환한다.
  backbone: stages 배열과 최상위 sourceRefIndexes를 요구한다. stages는 하나 이상이며 각 항목은 stageId, order, role, coreProblem, funnelSummary, sourceRefIndexes를 가진다.
  detailed_stage: DetailedStage 생성 응답의 실제 모든 필드를 포함한다. top-level, revelations, threat, pressure, funnel, situations 안의 sourceRefIndexes는 해당 상세 요청의 번호 매긴 허용 원문 참조 목록을 가리킨다. 서버가 전체 목록을 기존 DetailedStage 및 자식 DTO의 sourceRefs로 변환한다. 비공개 응답은 같은 응답에서 정의하는 ID의 독립 문자열 대신 정수 인덱스를 사용한다. funnel.requiredRevelationIndexes는 revelations[].revelationId를 가리키고, 각 상황의 revelationIndexes·pressureIndexes·funnelIndexes·funnelPredicateIndexes·importantConsequenceIndexes는 각각 revelations[].revelationId, pressure.pressureId, funnel.funnelId, funnel.requiredPredicateIds, 최상위 importantConsequenceIds를 가리킨다. 애플리케이션은 음수가 아니고 범위 안인 정수인지 확인한 뒤 기존 ID 필드로 변환하며 기존 도메인 생성자와 검증은 그대로 적용한다. pressureIndexes와 funnelIndexes는 각각 단일 pressure.pressureId와 funnel.funnelId 목록을 가리키므로 항목 값은 0만 허용하고 배열 자체는 비어 있을 수 있다. 다른 같은 응답의 대상 목록 범위는 실제 생성된 목록 크기로 검증한다. 범위 오류는 고정 필드명과 허용 대상 개수만 진단하며 반환 인덱스, 대상 ID, 원문 문장은 포함하지 않는다. 각 상황의 intents 배열은 하나 이상이어야 하며 다섯 인덱스 배열 중 하나 이상은 하나 이상의 항목을 가져야 한다. 이 제약은 모든 필드가 required이고 additionalProperties=false인 다섯 anyOf 객체 분기로 표현하며 각 분기는 대상 인덱스 배열 하나만 minItems=1로 제한한다. 개별 대상 배열은 비어 있을 수 있고 intent별 대상 대응을 새로 강제하지 않는다. mapDefinitionId는 해당 패키지에서 제공한 지도 ID 문자열 중 하나 또는 null이어야 하며 제공 지도가 없으면 null만 허용한다. 이 값은 저장·외부 DTO의 UUID 필드로 변환된다. 초기 전체 준비에서는 상세 요청마다 전체 추출 목록을 문맥으로 유지하고, 앞선 단계에 이미 배정한 SOURCE_EXTRACTED 필수 상황 ID 목록을 별도로 전달한다. 프롬프트는 해당 ID를 현재 단계에 다시 출력하지 말고 아직 배정되지 않은 추출 필수 상황을 원래 식별자·요약·선행 관계·근거와 함께 출력하도록 한다. 배정 ID는 순차 생성 중에만 누적하며 최종 전역 검증은 누락·중복을 계속 거부한다. 나머지 핵심 요소·상황 참조 배열은 빈 배열이 허용된다. RAG 검색 후보에서 추출된 근거와 필수 인용의 위치 대응은 기존 애플리케이션 검증으로 확인한다.
  opening_situation_index: 비공개 상세 생성 응답은 상황별 opening boolean 대신 최상위 openingSituationIndex(0부터 시작하는 situations 배열 인덱스 또는 null)를 요구한다. 첫 단계의 내부 요청은 이 값을 0 이상 정수로 제한하고 필수로 하며, 이후 단계는 정수 또는 null로 허용한다. 어댑터는 null 여부·정수 유형·범위와 첫 단계 필수 조건을 검사한 뒤 선택된 상황에만 기존 opening=true를 설정하고 private 필드를 제거한다. 첫 단계에 시작 상황이 필요한 기존 검증과 기존 저장·외부 DTO는 유지한다.
  supplemented_situation_ids: 비공개 상세 응답에서 required=false이고 provenance=GM_SUPPLEMENTED인 상황 ID는 `gm-supplemented:<단계 ID 길이>:<단계 ID>:<원래 ID>`로 정규화해 단계마다 고유하게 만든다. 같은 응답의 prerequisiteSituationIds 중 해당 상황을 가리키는 값은 같은 정본 ID로 바꾼다. 검토된 필수 상황 ID·자료·근거·선행 관계는 변경하지 않는다. 단계 ID와 보호된 ID의 충돌 또는 보호 ID와 겹쳐 참조 대상을 판별할 수 없는 경우는 거부한다. 전역 중복·선행 항목 존재·순환 검증과 전체 검증 후 저장을 유지한다. 중복 오류 진단에는 단계 ID, provenance, required 여부만 포함하고 상황 ID와 원문 문장은 포함하지 않는다.
  domain_validation: 스키마로 보장되지 않는 원문 위치·제공 맵·상황 관계, 정수 인덱스 범위, ID 보존 및 전체 결과 검증은 기존 도메인 검증이 계속 강제한다. 상세 대상 인덱스 범위 오류 진단에는 필드명과 허용 대상 개수만 포함한다. 유효하지 않은 응답은 저장 전에 거부한다.
required_situation_contract: "`RequiredSituation(situationId, summary, prerequisiteSituationIds, sourceRefs)`는 RAG 검색 후보에서 추출한 필수 상황과 위치 참조를 나타낸다. `StageBackbone.requiredSituations`에 보관하며 상세 생성 요청에도 전달한다. 각 추출 목록 항목에는 정확히 연결되는 최종 필수 `SituationDefinition`이 있어야 하며 해당 필수 상황의 `SOURCE_EXTRACTED` 출처 위치 집합은 추출 항목의 sourceRefs와 정확히 같아야 하고 `prerequisiteSituationIds`도 일치해야 한다. 추가·누락 인용 위치를 모두 거부한다. 중간 후보와 GM 보완 상황은 이 원문 필수 상황 대응 검사 대상이 아니며, 기존 출처 규칙을 따른다. 목록의 필수 상황·관계 누락, 출처 위치 불일치, 원문에 없는 선행 관계는 게시 전에 거부한다. 추출된 필수 상황 관계에 한해 선행 상황이 의존 상황과 같은 단계 또는 앞선 단계에 있는지 검증한다. 같은 단계 관계는 허용하고, 뒤 단계에 있는 선행 상황은 현재 다음 단계 순차 전환으로 도달할 수 없으므로 거부한다. 그 밖의 후보 관계와 무관한 단계 순서는 제한하거나 재배치하지 않는다."
storage:
  source: 추가 룰북 및 원문 위치는 기존 패키지·추출 개정 참조를 사용한다. 원문이나 맵 파일을 복제하는 기능을 추가하지 않는다.
  initial: 기존 패키지 단위 테이블을 이관하지 않고 신규 모험별 준비 자료를 저장할 두 테이블을 새 마이그레이션으로 만든다. 기존 StageArtifactRepository와 PostgreSQL 어댑터는 신규 테이블을 사용한다. 골격 기본 키는 모험 식별자와 골격 개정이고 상세 자료 기본 키는 모험 식별자·골격 개정·단계 식별자·상세 개정이다. 상세 자료는 같은 모험의 골격에 복합 외래키로 연결한다. 패키지 식별자는 별도 원문 참조로 저장한다. 기존 자료를 신규 모험에 매핑하거나 이관하지 않는다.
  reservation: 준비 자료 저장 전에 해당 모험이 존재하거나 세션이 그 모험을 예약한 상태인지 검증한다. 외래키를 만들면 예약 시점에 참조 행을 먼저 저장하는 실제 호출 순서와 맞춘다.
  prepared_immutability: 게시된 초기 상황 정의는 모험별 준비 개정의 불변 자료다. 다른 모험의 자료를 동일 결과로 캐시하거나 공유하지 않는다.
  generated: 플레이 중 생성한 상황과 선택·사용 상태는 그 모험의 StoryRuntimeState에 저장한다. 게시된 초기 정의를 수정하거나 공용 패키지에 덧붙이지 않는다.
  stage_references: 상황 정의는 원래 단계와 핵심 요소의 참조를 유지하고 상황 진행 상태는 준비된 전체 상황의 사용 여부와 필수 상황의 진행을 추적한다. 다음 단계 선택과 전환도 원문 선행 관계를 검증하며 단순한 order + 1로 제한하지 않는다.
  json: PostgresAdventureRepository와 PostgresRuntimeTurnRepository에서 신규 JSON을 저장·복원한다. 이전 JSON의 누락 필드를 메우는 호환성 생성자나 변환 어댑터를 추가하지 않는다.
  protection: 기존 자료의 삭제와 기존 모험의 일괄 재생성은 하지 않는다. 새 형식의 저장·재시작·중복 처리 검증은 호환성 제외와 무관하게 필수다.
situation_semantics:
  required: 필수 상황인지 중간 후보인지 구분한다. 원문에 없는 필수 사건을 임의로 원문 추출이라고 표시하지 않는다.
  prerequisites: 원문에 명시된 선행 상황만 식별자 목록으로 저장한다. 없는 식별자·자기 참조·순환 참조를 거부한다. 검토된 필수 상황 사이 관계는 선행 상황의 단계 순서가 의존 상황보다 늦지 않은지 확인하며 같은 단계는 허용한다. 목록이 비어 있거나 검토되지 않은 후보 관계에는 임의 선후 제약을 추가하지 않는다.
  ingredients: 기존 상황 의도와 정보·압박·다음 진행 조건·중요 결과 참조를 재사용한다. 필요한 핵심 요소만 채우고 상세 대본을 준비하지 않는다.
  provenance: 원문 추출 항목은 원문 위치를 보존하고 GM 보완 항목은 보완임을 명시해 원문에서 확인된 내용과 구분한다. 허위 출처를 허용하지 않는다.
  map: 제공 맵의 식별자 또는 맵 없음으로 표현한다. GM이 연결을 제안해도 해당 모험의 제공 맵 범위 안인지 검증한다.
turn_flow:
  - 현재 상황 계속 진행인지 전환이 필요한지 GM이 플레이 행동과 확정 사건으로 판단한다. 매 턴 새 상황을 강제로 생성하지 않는다.
  - 전환 시 해당 모험의 준비 후보와 필수 상황의 선행 관계·사용 상태를 입력으로 전달한다. 적합한 후보를 선택하거나 후보가 없으면 새 중간 상황을 제안한다.
  - 원문 필수 상황·선행 관계·확정 사건·모험 소유권·공개 범위와 제공 맵 참조를 검증한다. 새 상황은 기존 핵심 요소에 연결되고 기존 사실을 변경하지 않는 후보로만 허용한다.
  - 이번 턴에서 기존 상황의 종료와 다음 상황의 활성화를 함께 표현한다. 서로 다른 두 턴으로 나누어 활성 상황이 없는 틈을 만들지 않는다.
  - 검증된 선택과 생성 결과를 PendingRuntimeState에 보존한다. 플레이어 굴림은 기존 대기 절차로 처리하며 해당 턴이 확정되기 전에는 상황 사용과 새 상황 등록을 확정하지 않는다.
  - 해당 모험 버전과 턴 식별자로 현재 상황·상황 진행 상태·신규 상황·게임 결과를 기존 턴의 한 번의 확정에 반영한다. 중복 제출은 기존 확정 결과를 반환하고 다른 모험의 진행 상태를 읽거나 수정하지 않는다.
failure_contracts:
  source_insufficient: 정상적인 GM 보완과 출처 구분으로 준비를 계속한다.
  invalid_generation: RAG에서 추출한 목록에 중복 식별자, 허용 범위 밖 sourceRefs, 존재하지 않는 prerequisiteSituationIds 또는 순환이 있으면 준비를 실패시킨다. 자동 정정 호출은 하지 않는다. 검색되지 않은 원문 내용의 누락은 구조 검증으로 판별할 수 없다.
  provider_failure: 기존 AI 요청의 제한·분류·재시도 정책을 사용한다. 호출 실패를 근거 부족이나 완성된 상황으로 바꾸지 않는다.
  storage_conflict: 동일 모험의 완성 결과를 조회하거나 현재 버전 충돌을 반환한다. 다른 모험 자료로 대체하지 않는다.
  pending_or_commit_failure: 확정 대기 제안을 보존하고 기존 턴 재개 절차를 사용한다. 실패한 턴의 선택·사용·추가 상황이 확정 상태로 나타나지 않게 한다.
  map_absent: 적합한 제공 맵이 없으면 맵 없이 서술·판정으로 진행한다. 제공되지 않은 맵이나 연결 통로를 생성하지 않는다.
scope:
  existing_entrypoints: AdventureSessionApplicationService와 AdventureStartApplicationService 모두 모험 소유 키를 전달한다. 실제 UI가 호출하는 시작 전 준비 경로와 최종 시작 경로를 함께 변경한다.
  existing_components: StageArtifactPreparationApplicationService, 기존 생성 포트와 실제 GM 어댑터 연결, StageArtifactRepository와 PostgreSQL 구현, 단계 전환 및 StoryRuntimeRules, RuntimeTurnApplicationService와 프롬프트·응답 변환, PendingRuntimeState, Adventure, 저장소, AdventureApiConfiguration을 변경한다.
  frontend: 기존 준비 및 시작 응답 계약을 유지한다. 별도 시나리오 편집 화면·새 공개 엔드포인트·새 배포 서비스는 만들지 않는다. 제공 맵 없는 상황을 시작할 수 있어야 한다.
  tests: 기존 생성자·요청·저장 호출의 테스트 자료를 신규 계약으로 갱신하고 실제 Bean 연결의 복수 상황 생성, 두 모험 분리, 재시도, 준비 전체 저장, 상황 선행 관계, 선택과 생성, 굴림 대기, 제공 맵 없음, 신규 상태 재시작을 검증한다. RAG 후보 범위, JSON schema 적용, 고유 식별자, 출처 위치, 선행 관계와 순환 오류 시 준비 실패도 확인한다. RAG 검색 누락의 완전성은 테스트 통과 조건으로 주장하지 않는다. #378 종단 간 확인은 실제 모험 시작까지의 통과 여부를 별도로 기록한다.
  excluded: 기존 모험의 이관·호환성 어댑터·이전 형식 회귀 지원·지도 생성·계획 전체 공개·새 서비스·신규 편집 UI는 제외한다.
coverage:
  design_scope: 제품 UC-1부터 UC-3 및 R-01부터 R-09를 준비·선택·생성·단일 확정 계약에 대응한다.
  domain_flow: 명령·후보·검증·준비 게시·상황 계속 또는 전환·턴 확정의 소유권과 조건을 위 흐름으로 정의했다.
  boundaries: 사용자가 승인한 기존 준비와 모험 실행 책임 내부 확장이다. 별도 책임 영역·모듈·배포 경계를 승격하지 않는다.
  ownership: 초기 자료는 모험별 준비 저장소, 플레이 변화는 해당 모험 상태, 원문과 맵 원본은 기존 소유자가 관리한다.
  types: RAG에서 추출한 결과는 기존 모험 소유 StageBackbone JSON에 저장하고, RequiredSituation은 필수 상황 식별자·요약·선행 식별자·위치 참조를 담는다. 별도 공유 정본은 만들지 않는다. 기존 상황과 단계 정의에는 제품의 필수 여부·선행 관계·출처 구분·제공 맵 참조를 반영한다.
  state_and_repository: 안정적인 모험 식별자 예약·모험 소유 키·초기 전체 게시·전체 상황 사용 상태·신규 상황·단일 턴 확정을 정의했다.
  program: 기존 포트의 구체 시그니처와 생성 입력·결과·실제 호출부 변경을 정의했다.
  technical: 기존 서비스와 PostgreSQL을 사용한다. 내부 요청과 JSON만 변경하고 호환성 어댑터를 추가하지 않는다.
  runtime: 모험별 버전과 턴 식별자, 준비 자료의 유일성, 생성 호출 밖의 짧은 저장 트랜잭션, 대기 후 단일 확정을 사용한다.
  recovery: 원문 조회·완전성·대조 실패, 정상 근거 부족, AI 오류·참조 오류·목록 불일치·저장 경쟁·굴림 대기·턴 확정 실패를 구분하고 기존 제한된 복구 절차를 사용한다. 검토 목록과 전체 생성 결과를 함께 저장하기 전 실패하면 어느 쪽도 완성된 플레이 자료로 보이지 않는다.
  security_and_observability: 모험 소유권·원문 범위·제공 맵·공개 여부·AI 제안을 검증한다. 기존 단계 진단만 확장하고 원문과 비공개 서술은 기록하지 않는다.
  change_and_verification: 실제 준비·시작 두 경로와 신규 저장 계약·턴 저장·테스트 자료를 함께 변경하고 신규 기능과 신규 상태의 실패 복구를 검증한다.
  tradeoffs: 모험별 독립 생성으로 생성량과 저장량이 늘어난다. 공유 최적화는 R-09에 반하므로 적용하지 않는다. 개발용이라는 사용자 지시로 기존 형식 유지 비용은 제외한다. 수치 목표는 미확정으로 남겨 근거 없이 만들지 않는다.
completion:
  authorization: 사용자 개발용이니까 그냥 호환성 생각하지 말고 하라고 지시에 따라 확정된 방향과 범위의 명세 작성을 진행한다. 동일 호환성 확인이나 추가 형식 승인 질문을 반복하지 않는다.
  blocking_questions: []
