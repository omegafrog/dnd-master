schema_version: 1
id: system-targets
system_characteristics:
  interaction: "전투 행동 미리보기는 마우스 위치에 따른 읽기 전용 표시이며, 클릭은 최종 실행을 요청하고 모험 준비는 규칙 자료를 추출하고 구조·지원 가능 요소를 확인하며, 사용자가 의미·수치·조건·출처를 최종 검토·수정·승인한다. 환경 응용을 계획하기 전 AI Game Master는 사용 가능한 환경 작업, 입력 형식과 제약을 받는다."
  workload: "턴 단위 전투이며 세션마다 인간 플레이어는 한 명이다. 준비 대상은 D&D 5판(2014) 기본 룰북의 전체 주문과 선택된 추가 자료다. 동시 세션 수와 요청량은 정해지지 않았다."
  state: "버전이 있는 구조화된 주문·행동 정의와 그 원문·사용자 수정 이력, 현재 전투 상태, 이동 위치와 지면으로부터의 높이를 다룬다. 사용자 승인 수정본은 모험 시작 전에 확정하고 현재 모험에만 적용한다."
  consistency: "전투 행동 미리보기는 상태나 비용을 변경하지 않으며, 최종 실행은 최신 상태로 재검증되어야 한다. 중복 명령은 효과를 반복하지 않아야 한다. 추가 환경 응용 실패 시 주문 기본 효과와 소비 자원은 유지되고 추가 응용만 실패한다. 관찰 가능한 추가 변화가 없으면 해당 실패는 서술하지 않고 넘어갈 수 있지만 기본 효과·소비 자원은 표시하며 숨겨진 상태는 공개하지 않는다. 환경 작업 호출 오류는 AI Game Master가 입력이나 작업 선택을 수정해 재시도할 수 있도록 전달하며, 재시도는 기본 효과나 소비 자원을 중복 적용하지 않는다. 준비 단계의 의미 검토는 사용자가 수행하며 모든 의미 조건·충돌의 결정론 검증은 요구하지 않는다."
  availability: "필수 규칙 항목이 지원되지 않으면 모험 시작을 차단한다. 비필수 추가 자료의 미지원은 경고 확인 후 허용한다."
  growth: "추가 규칙 정의와 명시적 예외 추가, 주문 효과의 환경 응용을 수용한다. 추가 기능 묶음·플러그인 설치·SDK 통합은 범위 밖이다."
initial:
  - id: ST-005
    metric: latency_p95_ms
    status: unresolved
    provenance: assumption
    confidence: low
    rationale: "수치 응답시간은 사용자에게 지정받지 않았으며 측정 근거가 없다."
expected_growth: []
architecture_boundary:
  - id: ST-001
    metric: data_volume
    status: resolved
    condition: "D&D 5판(2014) 기본 룰북의 권위 있는 주문 목록 전체가 각 항목별 고유 식별자, 출처 및 실행 지원 여부와 연결되어야 하며, 주문을 누락하면 전체 지원 완료로 표시할 수 없다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 기본 룰북 전체 범위이며 AC-01과 AC-02에 기록되어 있다."
  - id: ST-002
    metric: concurrency
    status: resolved
    condition: "전투 행동 미리보기는 위치·자원·전투 상태를 바꾸지 않으며 최종 실행은 현재 상태 기준으로 검증되어야 한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 미리보기와 실행 조건이며 BR-14와 BR-15에 기록되어 있다."
  - id: ST-003
    metric: availability
    status: resolved
    condition: "선택 캐릭터 또는 필수 시나리오에 필요한 비활성 규칙 항목이 있으면 모험 시작을 차단한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 필수 항목 시작 차단 규칙이며 BR-03에 기록되어 있다."
  - id: ST-004
    metric: data_volume
    status: resolved
    condition: "전장의 안개와 기존 공개 정책이 허용하지 않는 지도 형상, 적 내부 수치 및 기타 정보를 전투 행동 미리보기에서 노출하지 않는다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 정보 비공개 조건이며 BR-14, BR-17, BR-21에 기록되어 있다."
  - id: ST-006
    metric: data_volume
    status: resolved
    condition: "사용자가 모험 시작 전에 검토·수정·승인한 주문·행동 정의는 현재 준비 중인 모험에만 적용하고 공개된 기본 룰북 정의나 다른 모험의 정의를 변경하지 않으며, 시작 이후 기존 버전 고정 규칙에 따라 유지한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 결정: '해당 모험에만 적용. 모험 시작전에 유저의 판단이 들어가 검증을 돌리니까'."
