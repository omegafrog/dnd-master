schema_version: 1
id: system-targets
system_characteristics:
  interaction: "Solo Player 한 명이 파티의 모든 캐릭터 이동·전투 행동·능력 습득·시트 변경을 선택하고 확정한다. 전투 중 이동은 행동 전·사이·후에 나눠 확정할 수 있고, 이동 중 GM 처리가 필요한 사건에서는 실제 칸과 소비한 이동량을 보존해 멈춘 뒤 최초 GM 요청 전에 같은 이동 작업을 GM 개입 대기로 저장한다. 최종 구조화 판정과 필수 후속 변경이 저장될 때까지 다른 행동과 턴 종료를 막는다. 기존 플레이어 굴림이 필요하면 같은 작업에 굴림을 제출할 수 있고, GM 최종 응답 실패·불일치도 대기를 풀지 않는다. AI Game Master는 세계·NPC·적·판정·결과 서술을 맡고, 일상 파티 대화를 생성할 수 있다. 중요한 파티 결정을 진행하기 전에 사용자 선택을 받는다. 전투 행동 미리보기는 마우스 위치에 따른 읽기 전용 표시이며 클릭은 최종 실행을 요청한다."
  workload: "턴 단위 전투이며 세션마다 인간 플레이어는 한 명이다. 한 플레이어가 파티의 모든 캐릭터를 조작하므로 캐릭터·그룹별 이동과 행동 요청이 발생할 수 있다. 동시 세션 수와 요청량은 정해지지 않았다."
  state: "버전이 있는 구조화된 주문·행동 정의와 그 원문·사용자 수정 이력, 현재 전투 상태, 이동 위치와 지면으로부터의 높이를 다룬다. 파티 모든 캐릭터의 사용자 확정 행동과 시트 변경, 시스템이 적용한 규칙 결과·자원 변화를 다룬다. 사용자 승인 수정본은 현재 모험에만 적용한다."
  consistency: "전투 행동 미리보기는 상태나 비용을 변경하지 않으며, 최종 실행은 최신 상태로 재검증되어야 한다. 파티의 중요한 행동·능력·시트 선택은 사용자가 확정하고, AI Game Master의 일상 대화는 파티 상태를 바꾸지 않는다. 확정된 규칙 결과와 자원 변화는 런타임 시스템이 적용한다. 중복 명령은 효과를 반복하지 않아야 한다. 이동 사건 처리 뒤 중단된 경로를 자동 실행하지 않으며, GM 서술만으로 플레이어 토큰을 옮기거나 턴을 끝내지 않는다. 추가 환경 응용 실패 시 주문 기본 효과와 소비 자원은 유지되고 추가 응용만 실패한다. 관찰 가능한 추가 변화가 없으면 해당 실패는 서술하지 않고 넘어갈 수 있지만 기본 효과·소비 자원은 표시하며 숨겨진 상태는 공개하지 않는다. 환경 작업 호출 오류는 AI Game Master가 입력이나 작업 선택을 수정해 재시도할 수 있도록 전달하며, 재시도는 기본 효과나 소비 자원을 중복 적용하지 않는다. 준비 단계의 의미 검토는 사용자가 수행하며 모든 의미 조건·충돌의 결정론 검증은 요구하지 않는다."
  availability: "필수 규칙 항목이 지원되지 않으면 모험 시작을 차단한다. 비필수 추가 자료의 미지원은 경고 확인 후 허용한다."
  growth: "추가 규칙 정의와 명시적 예외 추가, 주문 효과의 환경 응용을 수용한다. 추가 기능 묶음·플러그인 설치·SDK 통합은 범위 밖이다."
initial:
  - id: ST-005
    metric: latency_p95_ms
    status: unresolved
    provenance: assumption
    confidence: low
    rationale: "수치 응답시간은 사용자에게 지정받지 않았으며 측정 근거가 없다."
expected_growth: []
architecture_boundary:
  - id: ST-001
    metric: data_volume
    status: resolved
    condition: "모험 파티 또는 적 캐릭터가 실제로 배운 능력 ID에 한해 출처와 실행 지원 상태를 연결하고, 필요한 능력 정의가 누락되면 해당 능력을 사용할 수 없다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자는 전체 주문을 미리 채우지 않고 파티·적이 배우고 사용할 수 있는 능력만 준비하도록 결정했다. AC-01과 AC-02에 기록되어 있다."
  - id: ST-002
    metric: concurrency
    status: resolved
    condition: "전투 행동 미리보기는 위치·자원·전투 상태를 바꾸지 않으며 최종 실행은 현재 상태 기준으로 검증되어야 한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 미리보기와 실행 조건이며 BR-14와 BR-15에 기록되어 있다."
  - id: ST-003
    metric: availability
    status: resolved
    condition: "선택 캐릭터 또는 필수 시나리오에 필요한 비활성 규칙 항목이 있으면 모험 시작을 차단한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 필수 항목 시작 차단 규칙이며 BR-03에 기록되어 있다."
  - id: ST-004
    metric: data_volume
    status: resolved
    condition: "전장의 안개와 기존 공개 정책이 허용하지 않는 지도 형상, 적 내부 수치 및 기타 정보를 전투 행동 미리보기에서 노출하지 않는다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 인터뷰에서 확정한 정보 비공개 조건이며 BR-14, BR-17, BR-21에 기록되어 있다."
  - id: ST-006
    metric: data_volume
    status: resolved
    condition: "사용자가 모험 시작 전에 검토·수정·승인한 주문·행동 정의는 현재 준비 중인 모험에만 적용하고 공개된 기본 룰북 정의나 다른 모험의 정의를 변경하지 않으며, 시작 이후 기존 버전 고정 규칙에 따라 유지한다."
    provenance: user_supplied
    confidence: high
    rationale: "사용자 결정: '해당 모험에만 적용. 모험 시작전에 유저의 판단이 들어가 검증을 돌리니까'."
