undary th{background:#e9edf3}details{margin-top:8px}@media(max-width:850px){.card{grid-template-columns:1fr}.score{grid-template-columns:1fr}} </style>

<header><h1>전처리 구조 정답 파일럿 · 사람 검수 대기</h1><p>세 PDF에서 3페이지씩 뽑은 초안입니다. 화면의 평가는 현재 전처리 결과와 초안 라벨의 비교이며, 정답 세트로 확정된 결과가 아닙니다.</p><p>표 셀 라벨은 표 제목을 캡션으로 분리하고, 실제 행과 열만 비교합니다. 페이지 옆 문맥 이미지는 선택된 9페이지의 채점에는 포함되지 않습니다.</p><div class="toolbar"><label>문서 <select id="filter"><option value="all">전체</option></select></label><label><input id="pending" type="checkbox"> 검수 대기만</label><button id="export">검수 메모 내려받기</button><button id="clear">이 기기에서 검수 표시 지우기</button><span id="count"></span></div></header>
<section class="summary"><div class="score" id="scores"></div></section>
<section class="boundary"><div class="box"><b>검토한 페이지 경계</b><p class="small">연결 여부는 문서의 큰 주제가 비슷한지를 뜻하지 않습니다. 같은 절이 다음 페이지로 이어지는지에 대한 초안입니다. 모두 수정할 수 있습니다.</p><div id="boundaryTable"></div></div></section>
<main id="list" class="list"></main>
<script>
const ITEMS=[{"document":"basic-roleplaying","title":"Basic Roleplaying","page":6,"image":"basic-roleplaying-page-006.png","annotation":{"source_sha256":"d38af1fc2c27326b0ee8e42af0579684220ccf30809b195275d9daf29cedbb28","page_number":6,"page_type":"text-native","blocks":[{"id":"a-basic-roleplaying-6-b1","text":"Your gamemaster should be prepared to guide you and the other players through the character creation process, knowing what professions are allowed and appropriate to the game or campaign, and what level of competency the characters should exhibit. These issues are most important to Step Seven and may influence Step Three .","bbox":[36.03,46.48,573.08,78.28]},{"id":"a-basic-roleplaying-6-b2","text":"Step One: Name and Characteristics","bbox":[36.03,90.53,217.31,102.53]},{"id":"a-basic-roleplaying-6-b3","text":"Write your character’s name at the top of the page. This should be appropriate to the setting and game being played. If no idea suggests itself yet, wait until later. You can write your own name on the character sheet as your gamemaster may need to keep track of which character belongs to whom.","bbox":[36.03,111.75,576.37,143.55]},{"id":"a-basic-roleplaying-6-b4","text":"• Choose your character’s gender and write it in the correct space. • Roll 3D6 for the characteristics Strength (STR), Constitution (CON), Power (POW), Dexterity (DEX), and Charisma (CHA). Enter the results in the appropriate places on your character sheet. • Roll 2D6+6 for the Intelligence (INT) and Size (SIZ) characteristics.","bbox":[48.03,152.5,573.93,198.33]},{"id":"a-basic-roleplaying-6-b5","text":"These numbers provide the bare bones of your character, determining what characteristics the character is strong or weak in.","bbox":[36.03,207.28,519.45,217.83]},{"id":"a-basic-roleplaying-6-b6","text":"• If you wish, redistribute up to 3 points between your characteristics. • No characteristic can begin at more than 21 points. • If you aren’t satisfied with the characteristics you have, and your gamemaster approves, you can start over.","bbox":[48.03,226.78,483.93,262.08]},{"id":"a-basic-roleplaying-6-b7","text":"If the campaign is using one or more types of powers, your gamemaster may allow you to increase your starting characteristics (see Chapter 4: Powers , particularly Diminish/Enhance Characteristic ).","bbox":[36.03,271.3,573.94,292.35]},{"id":"a-basic-roleplaying-6-b8","text":"Choosing Characteristic Values (Option): Traditionally, characteristics are rolled in order, with up to 3 points redistributed. Instead, you may roll 3D6 seven times and choose where results go. In this case, SIZ and INT cannot be below 8.","bbox":[36.03,301.3,570.04,322.35]},{"id":"a-basic-roleplaying-6-b9","text":"Higher Starting Characteristics (Option): For a higher-powered game, roll 2D6+6 for all characteristics.","bbox":[36.03,331.3,444.15,341.85]},{"id":"a-basic-roleplaying-6-b10","text":"The Education (EDU) Characteristic (Option): Roll 2D6+6 for Education (EDU) for this characteristic, for characters from societies with formalized education. An EDU of 12 indicates a high school graduate-level education, with higher values indicating college or advanced degrees.","bbox":[36.03,350.82,566.49,382.62]},{"id":"a-basic-roleplaying-6-b11","text":"Cultural Modifiers (Option): Cultural modifiers emphasize characteristic differences between different species (such as elves or dwarves) or for different human cultures. Initial characteristics may be adjusted or limited at this point. See Cultural Characteristic Modifiers (Option) .","bbox":[36.03,391.57,571.87,423.37]},{"id":"a-basic-roleplaying-6-b12","text":"Non-human Characters (Option): Non-human characters may use different dice rolls and modifiers to determine initial characteristics. See Chapter 11: Creatures .","bbox":[36.03,432.35,576.71,453.4]},{"id":"a-basic-roleplaying-6-b13","text":"Point-based Character Creation (Option): Usually, characteristics are rolled randomly. Instead, players can purchase characteristic points from a pool. See Point-based Character Creation (Option) .","bbox":[36.03,462.35,574.96,483.4]},{"id":"a-basic-roleplaying-6-b14","text":"Step Two: Powers","bbox":[36.03,495.9,128.01,507.9]},{"id":"a-basic-roleplaying-6-b15","text":"Read this carefully! If the game you’re playing in involves magic, mutations, psychic abilities, sorcery, or superpowers you may begin with some of these powers. Ask your gamemaster about it and refer to Chapter 4: Powers for more information. These systems require more explanation than is provided in this chapter.","bbox":[36.03,517.12,565.0,548.92]},{"id":"a-basic-roleplaying-6-b16","text":"If there are no powers in the campaign, ignore this step and proceed.","bbox":[36.03,557.87,301.11,568.42]},{"id":"a-basic-roleplaying-6-b17","text":"If there are powers, the following types are available:","bbox":[36.03,577.37,241.83,587.92]},{"id":"a-basic-roleplaying-6-b18","text":"• Magic: Simple spellcasting with a wide variety of applications. • Mutations: Strange genetic anomalies, some beneficial, some adverse. • Psychic Abilities: Using the power of the mind to manipulate reality. • Sorcery: A more baroque type of spellcasting, including elemental and demonic summoning. • Superpowers: Mighty abilities that defy imagination.","bbox":[48.03,596.9,428.9,656.95]},{"id":"a-basic-roleplaying-6-b19","text":"More detail on each appears in their relevant sections.","bbox":[36.03,665.92,245.58,676.47]},{"id":"a-basic-roleplaying-6-b20","text":"Step Three: Age","bbox":[36.03,688.97,117.51,700.97]},{"id":"a-basic-roleplaying-6-b21","text":"The default age for characters is 17+1D6 years old. Your gamemaster may choose to alter this based on the requirements of the game setting. If you wish to begin play with a character younger or older, choose an age that seems appropriate and meets your gamemaster’s approval.","bbox":[36.03,710.17,578.16,731.22]}],"reading_order":["a-basic-roleplaying-6-b1","a-basic-roleplaying-6-b2","a-basic-roleplaying-6-b3","a-basic-roleplaying-6-b4","a-basic-roleplaying-6-b5","a-basic-roleplaying-6-b6","a-basic-roleplaying-6-b7","a-basic-roleplaying-6-b8","a-basic-roleplaying-6-b9","a-basic-roleplaying-6-b10","a-basic-roleplaying-6-b11","a-basic-roleplaying-6-b12","a-basic-roleplaying-6-b13","a-basic-roleplaying-6-b14","a-basic-roleplaying-6-b15","a-basic-roleplaying-6-b16","a-basic-roleplaying-6-b17","a-basic-roleplaying-6-b18","a-basic-roleplaying-6-b19","a-basic-roleplaying-6-b20","a-basic-roleplaying-6-b21"],"headings":[{"id":"h-basic-roleplaying-6-1","block_id":"a-basic-roleplaying-6-b2","level":2},{"id":"h-basic-roleplaying-6-2","block_id":"a-basic-roleplaying-6-b14","level":2},{"id":"h-basic-roleplaying-6-3","block_id":"a-basic-roleplaying-6-b20","level":2}],"section_continuations":[{"id":"sc-basic-roleplaying-5-to-6","source":{"page_number":5,"anchor":{"text":"Creating a Character","bbox":[36.025001525878906,630.9500122070312,157.74400329589844,644.9500122070312]}},"destination":{"page_number":6,"block_id":"a-basic-roleplaying-6-b1"},"section_relation":"SAME_SECTION","content_continuity":"NONE"},{"id":"sc-basic-roleplaying-6-to-7","source":{"page_number":6,"block_id":"a-basic-roleplaying-6-b21"},"destination":{"page_number":7,"block_id":"a-basic-roleplaying-7-b1"},"section_relation":"SAME_SECTION","content_continuity":"NONE"}]}},{"document":"basic-roleplaying","title":"Basic Roleplaying","page":7,"image":"basic-roleplaying-page-007.png","annotation":{"source_sha256":"d38af1fc2c27326b0ee8e42af0579684220ccf30809b195275d9daf29cedbb28","page_number":7,"page_type":"text-native","blocks":[{"id":"a-basic-roleplaying-7-b1","text":"• For every full 10 years added to the rolled starting age, based on the level of the campaign, modify professional skill points by +0 (Normal), +20 (Heroic), +30 (Epic), or +40 (Superhuman) (see Step Seven ). • Any fraction of years below 10 does not qualify for this skill bonus. Based on level of campaign, for every year below the minimum age (18) described above, subtract 0 (Normal), 20 (Heroic), 30 (Epic), or 40 skill points (Superhuman) from your character’s professional skill points. • Your gamemaster may limit available professions to characters below 18 years of age. • At age 50 and every full 10 years above, modify one of STR, CON, DEX, or CHA (your choice) by –1. At age 80 and every full 10 years above, modify three of these characteristics. See Aging and Inaction (Option) . • For every year below the original rolled age above, modify any one characteristic other than EDU (your choice) by –1. Your gamemaster may require that you make SIZ one of these lowered characteristics. These points can be gained through play (experience), training, or gradually through natural means (gamemaster’s discretion). See Aging and Inaction (Option) .","bbox":[48.03,46.48,575.76,169.8]},{"id":"a-basic-roleplaying-7-b2","text":"Your gamemaster may also choose to simply ignore these rules, based on the game’s power level. This allows for elderly adventurers, child geniuses, and is generally more enjoyable for all players.","bbox":[36.03,178.75,568.91,199.83]},{"id":"a-basic-roleplaying-7-b3","text":"Education (EDU) (Option): If you’re using the EDU characteristic, your character’s starting age must be at least EDU+5 (representing time spent learning). Every full 10 years added to your character’s starting age, adds +1 to your character’s EDU characteristic. Be sure to increase the relevant skill points generated in Step Six .","bbox":[36.03,209.03,578.07,240.58]},{"id":"a-basic-roleplaying-7-b4","text":"Step Four: Characteristic Rolls","bbox":[36.03,253.07,187.29,265.07]},{"id":"a-basic-roleplaying-7-b5","text":"Here’s where you determine your characteristic rolls. By now you should know what your final characteristics are, but if not, hold off on this step until you’ve finalized them. Each has a place on the character sheet.","bbox":[36.03,274.3,574.94,295.35]},{"id":"a-basic-roleplaying-7-b6","text":"• Multiply STR×5 for your Effort roll. • Multiply CON×5 for your Stamina roll. • Multiply INT×5 for your Idea roll. • Multiply POW×5 for your Luck roll. • Multiply DEX×5 for your Agility roll. • Multiply CHA×5 for your Charm roll.","bbox":[48.03,304.3,219.08,376.62]},{"id":"a-basic-roleplaying-7-b7","text":"Knowledge Roll (Option): Multiply EDU×5 for your Knowledge roll (if EDU is being used).","bbox":[36.03,385.82,386.63,396.37]},{"id":"a-basic-roleplaying-7-b8","text":"Step Five: Derived Characteristics","bbox":[36.03,408.62,204.79,420.62]},{"id":"a-basic-roleplaying-7-b9","text":"Now it’s time for the derived characteristics: damage modifier, hit points, power points and experience bonus. If you’re using optional systems, you should also determine your initial fatigue points and sanity points. Write the results on your character sheet.","bbox":[36.03,429.85,549.82,451.15]},{"id":"a-basic-roleplaying-7-b10","text":"• Damage Modifier: Add STR+SIZ and find the damage modifier corresponding to your character’s total on the Damage Modifier table. • Hit Points: Add CON+SIZ and divide by 2 (rounded up). Circle that number in the Hit Points box on your character sheet and write it below. This is your character’s maximum hit points. If your character loses hit points, mark them off, and erase the marks as hit points are healed or otherwise restored. • Major Wound Level: Your major wound level is 1/2 hit points, rounded up. • Power Points: In the Power Point box, circle the number equal to POW and write the total on the line below. This is your character’s maximum power points. These fuel magic spells, mutations, psychic abilities, or superpowers. Mark power points off as they’re spent and erase the marks as they’re recovered or otherwise restored. The number written in the space, equal to your POW, is the value your power points return to with rest. • Experience Bonus: Your character’s experience bonus is equal to 1/2 their INT, rounded up. • Move (MOV): Your character’s MOV measures how fast during a combat round they can move. Human characters can normally move 10 units per round. A unit is a somewhat variable amount usually equaling 1 meter. See Movement Rates .","bbox":[48.03,460.1,577.37,606.2]},{"id":"a-basic-roleplaying-7-b11","text":"Skill Bonuses (Option): If using characteristic-based skill category bonuses, calculate the bonus for each using the Skill Category Bonus table. Write these values in the spaces for each category. This bonus adds to the base chance for every skill, if any. For each category:","bbox":[36.03,615.4,564.2,636.45]},{"id":"a-basic-roleplaying-7-b12","text":"• Add +1% for every point in the primary characteristic over 10; subtract 1% for every point below 10. • +1% for every 2 points in the secondary characteristic above 10; –1% for every 2 points under 10 (rounding down the bonus if required). • –1% for every point in the negative characteristic above 10; +1% for every point under 10.","bbox":[48.03,645.4,559.69,691.23]},{"id":"a-basic-roleplaying-7-b13","text":"Hit Points per Location (Option): With the optional hit location system, determine the number of hit points for each hit location. The head, abdomen, and each leg have 1/3 of your hit point total, the chest has 4/10, and each arm has 1/4 of the total hit point value. Round all fractions up.","bbox":[36.03,700.17,574.8,731.72]}],"reading_order":["a-basic-roleplaying-7-b1","a-basic-roleplaying-7-b2","a-basic-roleplaying-7-b3","a-basic-roleplaying-7-b4","a-basic-roleplaying-7-b5","a-basic-roleplaying-7-b6","a-basic-roleplaying-7-b7","a-basic-roleplaying-7-b8","a-basic-roleplaying-7-b9","a-basic-roleplaying-7-b10","a-basic-roleplaying-7-b11","a-basic-roleplaying-7-b12","a-basic-roleplaying-7-b13"],"headings":[{"id":"h-basic-roleplaying-7-1","block_id":"a-basic-roleplaying-7-b4","level":2},{"id":"h-basic-roleplaying-7-2","block_id":"a-basic-roleplaying-7-b8","level":2}],"section_continuations":[{"id":"sc-basic-roleplaying-7-to-8","source":{"page_number":7,"block_id":"a-basic-roleplaying-7-b13"},"destination":{"page_number":8,"block_id":"a-basic-roleplaying-8-b1"},"section_relation":"SAME_SECTION","content_continuity":"NONE"}]}},{"document":"basic-roleplaying","title":"Basic Roleplaying","page":8,"image":"basic-roleplaying-page-008.png","annotation":{"source_sha256":"d38af1fc2c27326b0ee8e42af0579684220ccf30809b195275d9daf29cedbb28","page_number":8,"page_type":"text-native","blocks":[{"id":"a-basic-roleplaying-8-b1","text":"Fatigue Points (Option): If fatigue is being used; add your character’s STR+CON to get their fatigue point total. In play, as your character expends energy or perform rigorous physical activity, they will lose fatigue points. They recover rapidly through rest and other means and change frequently.","bbox":[36.03,46.48,568.03,78.28]},{"id":"a-basic-roleplaying-8-b2","text":"Sanity (Option): If Sanity is being used; multiply your character’s initial POW score by ×5 to get their current Sanity (SAN) total. In play, mark these off on your character sheet when your character loses sanity points. When your character reaches 0 SAN, they are considered unplayable.","bbox":[36.03,87.23,562.5,118.8]},{"id":"a-basic-roleplaying-8-b3","text":"Step Six: Personality (Optional)","bbox":[36.03,131.3,193.54,143.3]},{"id":"a-basic-roleplaying-8-b4","text":"Study your character’s characteristics and imagine the sort of person you would like them to be. Choose one of the options below or roll 1D4 for a random result. These packages of skills are a quick way to develop your character—there will be more skills in the next step. Skills are defined in Chapter 3: Skills 37–52 and classes of weapons are described in Chapter 8: Equipment .","bbox":[36.03,152.5,575.41,184.05]},{"id":"a-basic-roleplaying-8-b5","text":"Personality Types","bbox":[36.03,196.58,126.51,208.58]},{"id":"a-basic-roleplaying-8-b6","text":"Result Description","bbox":[36.03,210.78,118.03,221.33]},{"id":"a-basic-roleplaying-8-b7","text":"1 Brutal: Your character thinks first of solving problems by means of physical force and brawn. Give 20 skill points each to Brawl, Climb, Dodge, Grapple, Insight, Jump, Ride, Sense, Stealth, Swim, Throw, and to any two Combat skills.","bbox":[36.03,224.78,562.27,245.83]},{"id":"a-basic-roleplaying-8-b8","text":"2 Skilled: Your character believes that technique, craft, and expertise are the secrets of success. Give 20 skill points each to Appraise, any one Craft, Disguise, Dodge, Fine Manipulation, First Aid, any one Knowledge skill, Navigate, Pilot, Ride, Sleight of Hand, Stealth, and to any one Combat skill.","bbox":[36.03,249.52,575.45,281.1]},{"id":"a-basic-roleplaying-8-b9","text":"3 Cunning: Your character first tries to outsmart an opponent to gain an advantage. Add 20 skill points each to Appraise, Bargain, Disguise, Insight, any two Knowledge skills, Listen, Research, Sense, Spot, Stealth, any one Technical skill (appropriate to setting), and any one Combat skill.","bbox":[36.03,284.8,567.83,316.35]},{"id":"a-basic-roleplaying-8-b10","text":"4 Charming: Your character enjoys persuading other people to work, while they make the decisions. Give 20 points each to Appraise, Bargain, Command, Etiquette, Fast Talk, Insight, Perform, Persuade, any one Language (Other), Language (Own), Sense, Status, and any one Combat skill.","bbox":[36.03,320.05,576.1,351.6]},{"id":"a-basic-roleplaying-8-b11","text":"Your gamemaster may have other personality types, or you can create your own, choosing 13 skills and adding 20 points to each skill rating (with your gamemaster’s approval).","bbox":[36.03,362.57,572.64,383.62]},{"id":"a-basic-roleplaying-8-b12","text":"When distributing these skill points, add the bonus to the base chance for each skill, usually presented as a value in parentheses after the skill, such as Fast Talk (15%). Write that total after the skill.","bbox":[36.03,392.57,561.36,413.62]},{"id":"a-basic-roleplaying-8-b13","text":"For example, adding 20 skill points to Fast Talk (15%) yields a rating of 15+20=35%.","bbox":[36.03,422.82,358.13,433.37]},{"id":"a-basic-roleplaying-8-b14","text":"Step Seven: Profession and Skills","bbox":[36.03,445.65,201.29,457.65]},{"id":"a-basic-roleplaying-8-b15","text":"To determine the starting skills for your character, turn to the professions list. Choose a profession there. Professions are described fully later in this chapter. Your gamemaster may restrict available professions, so ask before making this choice. Some professions provide special advantages, such as the use of magic. Note these on the character sheet.","bbox":[36.03,466.85,576.85,498.65]},{"id":"a-basic-roleplaying-8-b16","text":"Once a profession has been chosen, determine the character’s professional skill point pool. This represents what your character has learned in that profession, whether through training or on-the-job experience. As always, skill points are added to any bonuses granted from previous steps and to the skill’s base chance.","bbox":[36.03,507.62,573.39,539.17]},{"id":"a-basic-roleplaying-8-b17","text":"The campaign’s power level determines the initial skill point pool. Your gamemaster should have decided by now what kind of game they will run, and how powerful and competent player characters should be.","bbox":[36.03,548.37,563.0,569.42]},{"id":"a-basic-roleplaying-8-b18","text":"• Normal: Allot 250 points to professional skills. No skill should begin higher than 75%. If you are using the optional skill category bonus, the limit is still 75%, and you must spend any points above this on other skills. If a combination of bonuses increases the skill to more than 75% before this step, do not add any additional skill points. • Heroic: Allot 325 points to professional skills. No skill should begin higher than 90%, with the same restrictions as above. • Epic: Allot 400 points to professional skills. No skill should begin higher than 101%, with the same restrictions as above. • Superhuman: Allot 500 points among professional skills, with no limit to skill ratings. See Skill Ratings Over 100% (Option) .","bbox":[48.03,578.37,566.87,647.2]},{"id":"a-basic-roleplaying-8-b19","text":"For an original profession, allot the power level’s number of skill points, as above. Your gamemaster may have some restrictions on how these skill points can be spent.","bbox":[36.03,656.15,558.94,677.23]},{"id":"a-basic-roleplaying-8-b20","text":"Once all professional skill points have been allocated, multiply your character’s INT×10 to determine their personal skill point pool. Spend these skill points on any skills you like, with your gamemaster’s approval. Add points spent on a skill to its base chance, profession bonuses (if any), professional skill point allocations, and skill category bonuses (if any).","bbox":[36.03,686.17,570.67,717.97]}],"reading_order":["a-basic-roleplaying-8-b1","a-basic-roleplaying-8-b2","a-basic-roleplaying-8-b3","a-basic-roleplaying-8-b4","a-basic-roleplaying-8-b5","a-basic-roleplaying-8-b6","a-basic-roleplaying-8-b7","a-basic-roleplaying-8-b8","a-basic-roleplaying-8-b9","a-basic-roleplaying-8-b10","a-basic-roleplaying-8-b11","a-basic-roleplaying-8-b12","a-basic-roleplaying-8-b13","a-basic-roleplaying-8-b14","a-basic-roleplaying-8-b15","a-basic-roleplaying-8-b16","a-basic-roleplaying-8-b17","a-basic-roleplaying-8-b18","a-basic-roleplaying-8-b19","a-basic-roleplaying-8-b20"],"headings":[{"id":"h-basic-roleplaying-8-1","block_id":"a-basic-roleplaying-8-b3","level":2},{"id":"h-basic-roleplaying-8-2","block_id":"a-basic-roleplaying-8-b5","level":3,"parent_id":"h-basic-roleplaying-8-1"},{"id":"h-basic-roleplaying-8-3","block_id":"a-basic-roleplaying-8-b14","level":2}],"tables":[{"bbox":[36.0,210.8,576.1,351.6],"rows":[["Result","Description"],["1","Brutal: Your character thinks first of solving problems by means of physical force and brawn. Give 20 skill points each to Brawl, Climb, Dodge, Grapple, Insight, Jump, Ride, Sense, Stealth, Swim, Throw, and to any two Combat skills."],["2","Skilled: Your character believes that technique, craft, and expertise are the secrets of success. Give 20 skill points each to Appraise, any one Craft, Disguise, Dodge, Fine Manipulation, First Aid, any one Knowledge skill, Navigate, Pilot, Ride, Sleight of Hand, Stealth, and to any one Combat skill."],["3","Cunning: Your character first tries to outsmart an opponent to gain an advantage. Add 20 skill points each to Appraise, Bargain, Disguise, Insight, any two Knowledge skills, Listen, Research, Sense, Spot, Stealth, any one Technical skill (appropriate to setting), and any one Combat skill."],["4","Charming: Your character enjoys persuading other people to work, while they make the decisions. Give 20 points each to Appraise, Bargain, Command, Etiquette, Fast Talk, Insight, Perform, Persuade, any one Language (Other), Language (Own), Sense, Status, and any one Combat skill."]]}],"section_continuations":[{"id":"sc-basic-roleplaying-8-to-9","source":{"page_number":8,"block_id":"a-basic-roleplaying-8-b20"},"destination":{"page_number":9,"anchor":{"text":"The total must not exceed","bbox":[36.025001525878906,46.48003005981445,565.156005859375,57.02803039550781]}},"section_relation":"SAME_SECTION","content_continuity":"NONE"}]}},{"document":"cairn-player","title":"Cairn Player Guide","page":9,"image":"cairn-player-page-009.png","annotation":{"source_sha256":"ed2869946b0de9d97398c975a3dde8d5701250eb4c8776cb40907fe23c6300bb","page_number":9,"page_type":"mixed","blocks":[{"id":"a-cairn-player-9-b1","text":"Attributes","bbox":[36.0,34.7,95.14,51.32]},{"id":"a-cairn-player-9-b2","text":"• Player Characters (PCs) have just three attributes: Strength (STR), Dexterity (DEX), and Willpower (WIL).","bbox":[40.5,54.1,354.01,76.88]},{"id":"a-cairn-player-9-b3","text":"• Roll 3d6 for each of your character’s attributes, in order. You may then swap any two of the results.","bbox":[40.5,80.6,353.2,103.38]},{"id":"a-cairn-player-9-b4","text":"• Attributes are not universal descriptors. A character with a low STR is not necessarily hopelessly weak; they can still attempt to lift a heavy door or survive a deadly fight! Their risk is simply higher.","bbox":[40.5,107.1,342.46,140.88]},{"id":"a-cairn-player-9-b5","text":"Hit Protection","bbox":[36.0,148.6,118.87,165.22]},{"id":"a-cairn-player-9-b6","text":"• Roll 1d6 to determine your PC’s starting Hit Protection (HP), which reflects their ability to avoid damage in combat. It does not indicate a character’s health or fortitude, nor do they lose it for very long. (See Healing in the Core Rules (pg. 62).)","bbox":[40.5,168.0,353.33,212.78]},{"id":"a-cairn-player-9-b7","text":"• If an attack takes a PC’s HP exactly to 0, the player must reference the Scars table (pg. 66).","bbox":[40.5,216.5,352.33,239.28]},{"id":"a-cairn-player-9-b8","text":"Inventory","bbox":[36.0,247.0,92.94,263.62]},{"id":"a-cairn-player-9-b9","text":"• Characters have a total of ten inventory slots but can only carry four items comfortably without the help of bags, backpacks, horses, carts, etc.","bbox":[40.5,266.4,346.2,289.18]},{"id":"a-cairn-player-9-b10","text":"• Each PC starts with a Backpack that can hold up to six slots of items or Fatigue (pg. 62). Carts (which must be pulled with both hands), Horses, or Mules can make a huge difference in how much a PC can bring with them on an adventure. Hirelings can also be paid to carry equipment.","bbox":[40.5,292.9,355.04,337.68]},{"id":"a-cairn-player-9-b11","text":"• Inventory is abstract, dependent only on the fiction as adjudicated by the Warden. Anyone carrying a full inventory (i.e. filling all 10 slots) is reduced to 0 HP. A character cannot fill more than ten slots.","bbox":[40.5,341.4,361.08,375.18]},{"id":"a-cairn-player-9-b12","text":"Inventory Slots","bbox":[36.0,382.9,124.58,399.52]},{"id":"a-cairn-player-9-b13","text":"• Most items take up one slot, unless otherwise indicated.","bbox":[40.5,402.3,271.0,414.08]},{"id":"a-cairn-player-9-b14","text":"• Petty items do not take up any slots. Bulky items take up two slots.","bbox":[40.5,417.8,312.4,429.58]},{"id":"a-cairn-player-9-b15","text":"• A bag of coins worth less than 100gp is petty and does not occupy a slot.","bbox":[40.5,433.3,334.56,445.08]}],"reading_order":["a-cairn-player-9-b1","a-cairn-player-9-b2","a-cairn-player-9-b3","a-cairn-player-9-b4","a-cairn-player-9-b5","a-cairn-player-9-b6","a-cairn-player-9-b7","a-cairn-player-9-b8","a-cairn-player-9-b9","a-cairn-player-9-b10","a-cairn-player-9-b11","a-cairn-player-9-b12","a-cairn-player-9-b13","a-cairn-player-9-b14","a-cairn-player-9-b15"],"headings":[{"id":"h-cairn-player-9-1","block_id":"a-cairn-player-9-b1","level":2},{"id":"h-cairn-player-9-2","block_id":"a-cairn-player-9-b5","level":2},{"id":"h-cairn-player-9-3","block_id":"a-cairn-player-9-b8","level":2},{"id":"h-cairn-player-9-4","block_id":"a-cairn-player-9-b12","level":3}],"section_continuations":[{"id":"sc-cairn-player-8-to-9","source":{"page_number":8,"anchor":{"text":"Creating a Character","bbox":[36.0,33.839874267578125,235.97999572753906,61.53987121582031]}},"destination":{"page_number":9,"block_id":"a-cairn-player-9-b1"},"section_relation":"UNRESOLVED","content_continuity":"NONE"},{"id":"cairn-player-9-to-10-different-section","source":{"page_number":9,"block_id":"a-cairn-player-9-b15"},"destination":{"page_number":10,"block_id":"a-cairn-player-10-b25"},"section_relation":"DIFFERENT_SECTION","content_continuity":"NONE"}]}},{"document":"cairn-player","title":"Cairn Player Guide","page":10,"image":"cairn-player-page-010.png","annotation":{"source_sha256":"ed2869946b0de9d97398c975a3dde8d5701250eb4c8776cb40907fe23c6300bb","page_number":10,"page_type":"text-native","blocks":[{"id":"a-cairn-player-10-b1","text":"Physique (d10)","bbox":[171.41,72.3,224.59,83.38]},{"id":"a-cairn-player-10-b2","text":"1 Athletic 6 Scrawny","bbox":[47.88,92.01,262.27,103.09]},{"id":"a-cairn-player-10-b3","text":"2 Brawny 7 Short","bbox":[47.37,111.81,250.97,122.89]},{"id":"a-cairn-player-10-b4", ["4","Deceitful","9","Vain"],["5","Greedy","10","Vengeful"]],"caption":"Vice (d10)"}]}},{"document":"cairn-warden","title":"Cairn Warden Guide","page":32,"image":"cairn-warden-page-032.png","annotation":{"source_sha256":"7f3917fffb205a0e09f80145bc8bd78c982ad9a6fef18d9d84b64b9d4b5ece8e","page_number":32,"page_type":"text-native","blocks":[{"id":"a-cairn-warden-32-b1","text":"Page 32","bbox":[27.0,587.64,52.02,597.34]},{"id":"a-cairn-warden-32-b2","text":"Dungeon Seeds","bbox":[27.0,42.84,173.56,70.54]},{"id":"a-cairn-warden-32-b3","text":"Dungeon Principles","bbox":[27.0,79.65,140.23,96.27]},{"id":"a-cairn-warden-32-b4","text":"Purpose Consider what the dungeon’s original purpose was as well as what it is being used for today. Demonstrate a dungeon’s history by including signs of its original inhabitants and their goals. Sometimes a dungeon will have multiple purposes, and these can collide against each other to create tension among its denizens.","bbox":[27.0,102.88,345.21,160.19]},{"id":"a-cairn-warden-32-b5","text":"Levels Though they should make sense as part of the dungeon’s construction and purpose, levels should also represent increasing danger. On each level, try to push players to weigh the risk of further exploration versus a potential reward.","bbox":[27.0,167.88,340.13,214.19]},{"id":"a-cairn-warden-32-b6","text":"Layout Create multiple entrances and exits, offer multiple routes, design choke points, and provide hiding spots. Add meaningful and obvious information to room entrances and exits.","bbox":[27.0,221.88,347.3,268.19]},{"id":"a-cairn-warden-32-b7","text":"Verticality Incorporate tall rooms, climbable structures, and paths that allow movement around and over obstacles.","bbox":[27.0,275.88,343.6,311.19]},{"id":"a-cairn-warden-32-b8","text":"Secret Areas Include hidden zones, including at least one that will likely remain undiscovered but is still worth finding. Try to avoid hiding crucial information behind secret rooms.","bbox":[27.0,318.88,349.47,354.19]},{"id":"a-cairn-warden-32-b9","text":"Rooms Vary room shapes, sizes, and functions. Use architectural motifs to connect rooms and provide hints of what’s to come. Room descriptions should be easy to map and recall.","bbox":[27.0,361.88,351.26,397.19]},{"id":"a-cairn-warden-32-b10","text":"Treasure Incorporate a variety of treasures beyond mere gold, such as knowledge, allies, trade goods, and artifacts. Add narrative elements to treasure to increase its non-monetary value.","bbox":[27.0,404.88,346.9,451.19]},{"id":"a-cairn-warden-32-b11","text":"Challenges Allow the characters to drive the story by writing challenges without prescribed outcomes. Create a sense of peril, but avoid making obstacles seem unbeatable. Overly dangerous areas and creatures should be obvious. Create encounters that can be avoided with critical thinking and problem-solving, not just violence. Remember that monsters and other obstacles are another way to tell the dungeon’s story.","bbox":[27.0,458.88,350.9,527.19]}],"reading_order":["a-cairn-warden-32-b2","a-cairn-warden-32-b3","a-cairn-warden-32-b4","a-cairn-warden-32-b5","a-cairn-warden-32-b6","a-cairn-warden-32-b7","a-cairn-warden-32-b8","a-cairn-warden-32-b9","a-cairn-warden-32-b10","a-cairn-warden-32-b11","a-cairn-warden-32-b1"],"headings":[{"id":"h-cairn-warden-32-1","anchor":{"text":"Dungeon Seeds","bbox":[27.0,42.839874267578125,173.55999755859375,70.53987121582031]},"level":1},{"id":"h-cairn-warden-32-2","anchor":{"text":"Dungeon Principles","bbox":[27.0,79.65202331542969,140.23202514648438,96.27201843261719]},"level":2,"parent_id":"h-cairn-warden-32-1"},{"id":"h-cairn-warden-32-3","anchor":{"text":"Purpose","bbox":[27.0,102.87989807128906,66.2699966430664,116.72989654541016]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-4","anchor":{"text":"Levels","bbox":[27.0,167.87989807128906,57.150001525878906,181.7299041748047]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-5","anchor":{"text":"Layout","bbox":[27.0,221.87989807128906,59.76000213623047,235.7299041748047]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-6","anchor":{"text":"Verticality","bbox":[27.0,275.8798828125,78.11000061035156,289.7298889160156]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-7","anchor":{"text":"Secret Areas","bbox":[27.0,318.8798828125,87.43000030517578,332.7298889160156]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-8","anchor":{"text":"Rooms","bbox":[27.0,361.8798828125,59.230003356933594,375.7298889160156]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-9","anchor":{"text":"Treasure","bbox":[27.0,404.8798828125,70.1300048828125,418.7298889160156]},"level":3,"parent_id":"h-cairn-warden-32-2"},{"id":"h-cairn-warden-32-10","anchor":{"text":"Challenges","bbox":[27.0,458.8798828125,79.11000061035156,472.7298889160156]},"level":3,"parent_id":"h-cairn-warden-32-2"}],"section_continuations":[{"id":"sc-cairn-warden-32-to-33","source":{"page_number":32,"block_id":"a-cairn-warden-32-b11"},"destination":{"page_number":33,"block_id":"a-cairn-warden-33-b2"},"section_relation":"SAME_SECTION","content_continuity":"NONE"},{"id":"cairn-warden-31-to-32-different-section","source":{"page_number":31,"anchor":{"text":"Worldbuilding: Put It All Together","bbox":[256.4,14.4,369.0,24.1]}},"destination":{"page_number":32,"block_id":"a-cairn-warden-32-b2"},"section_relation":"DIFFERENT_SECTION","content_continuity":"NONE"},{"id":"cairn-warden-118-to-119-unresolved","source":{"page_number":118,"anchor":{"text":"Adjectives","bbox":[27.0,43.704,86.076,60.324]}},"destination":{"page_number":119,"anchor":{"text":"Nouns","bbox":[45.0,43.704,81.936,60.324]}},"section_relation":"UNRESOLVED","content_continuity":"NONE"}]}},{"document":"cairn-warden","title":"Cairn Warden Guide","page":33,"image":"cairn-warden-page-033.png","annotation":{"source_sha256":"7f3917fffb205a0e09f80145bc8bd78c982ad9a6fef18d9d84b64b9d4b5ece8e","page_number":33,"page_type":"text-native","blocks":[{"id":"a-cairn-warden-33-b1","text":"Page 33","bbox":[343.84,587.64,369.0,597.34]},{"id":"a-cairn-warden-33-b2","text":"NPCs Include engaging NPCs with their own goals and agendas. These characters may want to stay in the dungeon; they may even love it! NPCs and monsters should communicate with the PCs, even during combat. Have them make threats, suggest compromises, or try to persuade the PCs whenever possible. Every character wants something, and has a limit to what they might do to get it.","bbox":[45.0,43.92,370.7,112.23]},{"id":"a-cairn-warden-33-b3","text":"Factions Factions should interact with both the characters and one another, acting on their own regardless of the character’s actions. Give them hierarchies and divisions that can be exploited.","bbox":[45.0,119.92,368.86,166.23]},{"id":"a-cairn-warden-33-b4","text":"Puzzles Create puzzles that have clear, actionable goals. Puzzles should reinforce the themes of the dungeon and build on its history. Make the challenge of the puzzle obvious, but the solution less so. Allow for multiple solutions, and for players to solve them using intelligence and critical thinking, not just special abilities or tools. Create built-in clues suggesting the puzzle’s origin and its effects.","bbox":[45.0,173.92,369.55,242.23]},{"id":"a-cairn-warden-33-b5","text":"The Dungeon Map Put boring or repetitive stuff (exits, room shapes, etc.) on the map, rather than in the room description. Obvious exits should be described using clear, distinct language. Number your rooms to help avoid confusion when referencing the map.","bbox":[45.0,249.92,361.76,296.23]},{"id":"a-cairn-warden-33-b6","text":"Room Keying Emphasize a room’s most important aspects (typically obvious threats or NPCs). Describe elements that help orient the party to their surroundings. Be specific, but avoid describing how the characters should feel. Only describe what’s happening now. If there is history here, the characters will discover it in play. Name each room!","bbox":[45.0,303.92,367.28,361.23]},{"id":"a-cairn-warden-33-b7","text":"Encounter Tables Create random events to help make a dungeon feel alive by making exploration tense and unpredictable, as parties may encounter wandering monsters, factions, NPCs, or signs of an approaching threat. Try to provide challenges, moments of respite, or opportunities for roleplay.","bbox":[45.0,368.92,362.92,426.23]}],"reading_order":["a-cairn-warden-33-b2","a-cairn-warden-33-b3","a-cairn-warden-33-b4","a-cairn-warden-33-b5","a-cairn-warden-33-b6","a-cairn-warden-33-b7","a-cairn-warden-33-b1"],"headings":[{"id":"h-cairn-warden-33-1","anchor":{"text":"NPCs","bbox":[45.0,43.91987609863281,70.8499984741211,57.769874572753906]},"level":3},{"id":"h-cairn-warden-33-2","anchor":{"text":"Factions","bbox":[45.0,119.91999816894531,85.4000015258789,133.77000427246094]},"level":3},{"id":"h-cairn-warden-33-3","anchor":{"text":"Puzzles","bbox":[45.0,173.9199981689453,81.19999694824219,187.77000427246094]},"level":3},{"id":"h-cairn-warden-33-4","anchor":{"text":"The Dungeon Map","bbox":[45.0,249.9199981689453,132.4199981689453,263.7699890136719]},"level":3},{"id":"h-cairn-warden-33-5","anchor":{"text":"Room Keying","bbox":[45.0,303.91998291015625,108.2199935913086,317.7699890136719]},"level":3},{"id":"h-cairn-warden-33-6","anchor":{"text":"Encounter Tables","bbox":[45.0,368.91998291015625,128.74000549316406,382.7699890136719]},"level":3}]}},{"document":"cairn-warden","title":"Cairn Warden Guide","page":119,"image":"cairn-warden-page-119.png","annotation":{"source_sha256":"7f3917fffb205a0e09f80145bc8bd78c982ad9a6fef18d9d84b64b9d4b5ece8e","page_number":119,"page_type":"text-native","blocks":[{"id":"a-cairn-warden-119-b1","text":"Page 119","bbox":[342.5,587.64,369.0,597.34]},{"id":"a-cairn-warden-119-b2","text":"d100 Noun d100 Noun d100 Noun d100 Noun","bbox":[48.14,77.28,333.4,88.36]},{"id":"a-cairn-warden-119-b3","text":"1 Abys
