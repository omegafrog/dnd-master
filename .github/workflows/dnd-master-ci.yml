name: DND Master CI

on:
  pull_request:
  push:
    branches: [main, "changes/**"]

permissions:
  contents: read

jobs:
  backend-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-access-service
          - adventure-service
          - rule-knowledge-service
          - character-management-service
          - dice-roll-service
          - combat-map-service
          - ai-game-master-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run focused service tests
        run: |
          gradle -p src :${{ matrix.service }}:test

  architecture-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Architecture tests
        run: |
          gradle -p src :architecture-tests:test
      - name: Contract tests
        run: |
          gradle -p src :contract-tests:test

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web-ui/package-lock.json
      - run: npm --prefix src/web-ui ci
      - run: npm --prefix src/web-ui run lint
      - run: npm --prefix src/web-ui test -- --run
      - run: npm --prefix src/web-ui run build

  preprocessing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install preprocessing test dependencies
        run: python -m pip install '.[test]'
      - name: Run layout-aware preprocessing tests
        run: python -m pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend-services, architecture-and-contracts, web-ui, preprocessing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web-ui/package-lock.json
      - name: Verify Docker runtime
        run: |
          docker version
          docker compose -f src/infra/compose.yaml config
      - run: npm --prefix src/web-ui ci
      - run: npx --prefix src/web-ui playwright install --with-deps chromium
      - name: Backend system E2E tests
        run: |
          gradle -p src :system-tests:integrationTest
      - name: Browser fixture smoke tests
        run: npm --prefix src/web-ui run test:e2e:ci
