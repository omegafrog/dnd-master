apiVersion: 1
kind: GmQualityGateDashboard
metadata:
  name: gm-quality-gate
  owner: adventure-platform
panels:
  - title: Gate result
    query: sum by (result) (rate(gm_quality_gate_total[15m]))
  - title: Safety violations
    query: sum(rate(gm_quality_secret_violations_total[15m])) + sum(rate(gm_quality_forbidden_tool_violations_total[15m])) + sum(rate(gm_quality_invented_state_violations_total[15m]))
  - title: Human score
    query: sum(rate(gm_quality_human_score_sum[15m])) / sum(rate(gm_quality_human_score_count[15m]))
  - title: Context utilization
    query: sum(rate(gm_context_utilization_sum[15m])) / sum(rate(gm_context_utilization_count[15m]))
  - title: Pending Saga
    query: gm_saga_pending
alerts:
  - name: GmQualityGateFailed
    expr: increase(gm_quality_gate_total{result="fail"}[15m]) > 0
    severity: critical
  - name: GmSafetyViolation
    expr: increase(gm_quality_secret_violations_total[15m]) + increase(gm_quality_forbidden_tool_violations_total[15m]) + increase(gm_quality_invented_state_violations_total[15m]) > 0
    severity: critical
  - name: GmContextNearLimit
    expr: sum(rate(gm_context_utilization_sum[10m])) / sum(rate(gm_context_utilization_count[10m])) > 0.7
    severity: warning
  - name: GmSagaPending
    expr: gm_saga_pending > 0
    severity: warning
