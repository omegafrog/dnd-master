openapi: 3.1.0
info: { title: AI Game Master API, version: 1.0.0 }
paths:
  /internal/v1/gm/scenes:
    post: { operationId: generateScene, responses: { '200': { description: scenario-bound scene } } }
  /internal/v1/gm/judgments:
    post: { operationId: adjudicate, responses: { '200': { description: rule-set judgment } } }
  /internal/v1/gm/rule-answers:
    post: { operationId: groundedAnswer, responses: { '200': { description: answer with sources or candidates } } }
  /internal/v1/gm/maps:
    post: { operationId: generateMap, responses: { '200': { description: AI map state } } }
  /internal/v1/gm/intent-classifications:
    post: { operationId: classifyIntent, responses: { '200': { description: GM query intent } } }
  /internal/v1/gm/agent-turns:
    post: { operationId: runReadOnlyAgentTurn, responses: { '200': { description: grounded read-only GM plan and final result } } }
