openapi: 3.1.0
info: { title: Rule Knowledge API, version: 1.0.0 }
paths:
  /api/v1/rulebooks:
    post:
      operationId: uploadRulebook
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: './schemas/batch-multipart-upload.json' }
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema: { $ref: './schemas/batch-upload-response.json' }
        '409':
          description: conflict - same idempotency key with different file
  /api/v1/rulebooks/{rulebookId}:
    get:
      operationId: rulebookStatus
      parameters:
        - name: rulebookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: processing status
          content:
            application/json:
              schema: { $ref: './schemas/rulebook-status-response.json' }
  /api/v1/rulebooks/{rulebookId}/source-preview:
    get:
      operationId: sourcePreview
      parameters:
        - name: rulebookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: source preview
          content:
            application/json:
              schema: { $ref: './schemas/source-preview-response.json' }
        '404':
          description: document not found
        '409':
          description: preview requires extracted content
        '422':
          description: preview only available for TXT documents
  /api/v1/rulebooks/{rulebookId}/retry:
    post:
      operationId: retryRulebook
      parameters:
        - name: rulebookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: retried document status
          content:
            application/json:
              schema: { $ref: './schemas/rulebook-status-response.json' }
        '404':
          description: document not found
        '409':
          description: retry rejected because document is not failed
  /api/v1/rulebooks/rule-set:
    post:
      operationId: saveRuleSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/rule-set-save-request.json' }
      responses:
        '204':
          description: rule set saved
        '400':
          description: invalid selection
  /internal/v1/rulebooks:
    get:
      operationId: ownedRulebooks
      parameters:
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: owned rulebooks
          content:
            application/json:
              schema: { $ref: './schemas/owned-rulebooks-response.json' }
  /internal/v1/rulebook-indexes:
    get:
      operationId: ownedIndexes
      parameters:
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: owned indexes
          content:
            application/json:
              schema: { $ref: './schemas/owned-indexes-response.json' }
  /internal/v1/rulebooks/{rulebookId}/ownership:
    get:
      operationId: rulebookOwnership
      parameters:
        - name: rulebookId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: playerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ownership
          content:
            application/json:
              schema: { $ref: './schemas/ownership-response.json' }
  /internal/v1/retrieval/rule-evidence:
    post:
      operationId: searchEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/evidence-search-request.json' }
      responses:
        '200':
          description: scoped evidence
          content:
            application/json:
              schema: { $ref: './schemas/evidence-search-response.json' }
  /internal/v1/story-sources/search:
    post:
      operationId: searchStorySources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/story-source-search-request.json' }
      responses:
        '200':
          description: owner and package scoped story evidence; empty evidence is explicit
          content:
            application/json:
              schema: { $ref: './schemas/story-source-search-response.json' }
  /internal/v1/character-context/search:
    post:
      operationId: searchCharacterContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/character-context-search-request.json' }
      responses:
        '200':
          description: independently searched, scoped typed character context evidence
          content:
            application/json:
              schema: { $ref: './schemas/character-context-search-response.json' }
  /internal/v1/story-sources/{documentId}/context:
    get:
      operationId: readStorySourceContext
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: extractionVersion
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: locator
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: requested source span and adjacent spans, or empty spans when locator is absent
          content:
            application/json:
              schema: { $ref: './schemas/story-source-context-response.json' }
