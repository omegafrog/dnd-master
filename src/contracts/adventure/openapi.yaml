openapi: 3.1.0
info: { title: Adventure API, version: 1.0.0 }
paths:
  /api/v1/adventure-sessions/{sessionId}/story-plan:
    get: { operationId: readStoryPlan, responses: { '200': { description: player-safe story plan } } }
    post: { operationId: generateStoryPlan, responses: { '200': { description: generated story plan } } }
  /api/v1/adventure-sessions/{sessionId}/story-plan/history:
    get:
      operationId: readGmStoryPlanHistory
      summary: Read append-only GM story-plan revisions for the owned session
      description: Requires the internal GM token and the authenticated owner; returns revision history including GM-only audit data and never exposes another owner's session.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Owner/session-scoped append-only GM story-plan revision history
          content:
            application/json:
              schema:
                type: array
                items: { type: object, required: [planId, version, status, stages, auditId, recordedAt, cause], properties: { planId: { type: string, format: uuid }, version: { type: integer, format: int64 }, status: { type: string }, stages: { type: array, items: { type: object } }, auditId: { type: string }, recordedAt: { type: string, format: date-time }, cause: { type: string }, predecessorHistoryId: { type: string, format: uuid, nullable: true } } }
        '401': { description: Missing or invalid X-Internal-Token }
        '403': { description: Authenticated owner does not own the requested session }
  /api/v1/adventure-sessions/{sessionId}/story-plan/gm:
    get: { operationId: readGmStoryPlan, responses: { '200': { description: GM tactical story plan } } }
  /api/v1/adventure-sessions/{sessionId}/story-plan/retry:
    post: { operationId: retryStoryPlan, responses: { '200': { description: regenerated story plan } } }
  /api/v1/adventure-sessions/{sessionId}/story-plan/stages/{position}/activate-map:
    post: { operationId: activateTacticalMap, responses: { '200': { description: active tactical map } } }
  /api/v1/adventure-sessions/{sessionId}/story-plan/stages/{position}/triggers/{triggerId}/apply:
    post:
      operationId: applyTacticalTrigger
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [combatMapId, commandId, expectedVersion, qualifyingAction], properties: { qualifyingAction: { type: string, minLength: 1 } } } } } }
      responses: { '200': { description: applied planned trigger }, '409': { description: stage or map is not active } }
  /api/v1/adventure-sessions/{sessionId}/story-plan/stages/{position}/tactical-scene/revise:
    post:
      operationId: reviseFutureTacticalScene
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [causingGmTurnId], properties: { causingGmTurnId: { type: string, format: uuid, description: GM turn that authored this future-stage revision } } } } } }
      responses: { '200': { description: validated future revision }, '400': { description: untrusted or invalid tactical scene rejected } }
  /api/v1/adventures/{adventureId}/events:
    get:
      operationId: streamAdventureEvents
      parameters:
        - { name: afterVersion, in: query, schema: { type: integer, format: int64, default: -1 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '200': { description: ordered committed session events, content: { text/event-stream: { schema: { type: string } } } }
  /api/v1/adventures/{adventureId}/turns:
    post:
      operationId: submitGmTurn
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match-Version, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [turnId, input], properties: { turnId: { type: string, format: uuid }, input: { type: object } } } }
      responses:
        '202': { description: accepted }
        '403': { description: adventure is not owned by bearer }
        '409': { description: stale version or idempotency conflict }
  /api/v1/adventures/scenarios:
    post: { operationId: uploadScenario, requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '../rule-knowledge/schemas/multipart-upload.json' } } } }, responses: { '202': { description: accepted } } }
  /api/v1/adventures/{adventureId}/messages:
    post:
      operationId: streamAdventure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, turnId, commandId, action]
              properties:
                playerId: { type: string, format: uuid }
                turnId: { type: string, format: uuid }
                commandId: { type: string, format: uuid }
                action: { type: string }
      responses:
        '200':
          description: event stream
          content:
            text/event-stream:
              schema: { $ref: './schemas/stream-event.json' }
  /api/v1/adventures/{adventureId}/rule-inquiries:
    post: { operationId: answerRuleInquiry, responses: { '200': { description: grounded answer or candidates } } }
  /api/v1/adventures/{adventureId}/combat-map:
    get: { operationId: playerMap, responses: { '200': { description: player view, content: { application/json: { schema: { $ref: '../combat-map/schemas/player-map-view.json' } } } } } }
  /api/v1/adventures/{adventureId}/dice-rolls:
    post:
      operationId: rollDice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruleSetId, characterSheetId, combatMapId, ownerPlayerId, tokenId, expectedVersion, role, action]
              properties:
                ruleSetId: { type: string, format: uuid }
                characterSheetId: { type: string, format: uuid }
                combatMapId: { type: string, format: uuid }
                ownerPlayerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                role: { type: string }
                action: { type: string }
      responses:
        '200': { description: role roll }
  /api/v1/adventures/{adventureId}/save:
    put: { operationId: saveAdventure, responses: { '200': { description: saved } } }
  /api/v1/adventures/{adventureId}/knowledge-documents:
    get: { operationId: readSessionKnowledgeSet, responses: { '200': { description: session knowledge set, content: { application/json: { schema: { $ref: './schemas/session-knowledge-set-response.json' } } } } } }
    put: { operationId: updateSessionKnowledgeSet, requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/session-knowledge-set-request.json' } } } }, responses: { '200': { description: saved session knowledge set, content: { application/json: { schema: { $ref: './schemas/session-knowledge-set-response.json' } } } } } }
  /api/v1/adventures/{adventureId}/resume:
    post: { operationId: resumeAdventure, responses: { '204': { description: resumed } } }
  /api/v1/adventures/{adventureId}:
    delete: { operationId: deleteAdventure, responses: { '204': { description: deleted } } }
  /internal/v1/adventures:
    get: { operationId: ownedAdventures, responses: { '200': { description: owned resources } } }
  /internal/v1/adventures/{adventureId}/edition:
    get: { operationId: appliedEdition, responses: { '200': { description: edition } } }
  /internal/v1/adventures/{adventureId}/roll-conditions:
    get: { operationId: rollConditions, responses: { '200': { description: conditions } } }
  /internal/v1/adventures/{adventureId}/movement-validations:
    post: { operationId: validateMovement, responses: { '200': { description: validation } } }
  /internal/v1/adventures/{adventureId}/gm-context:
    get: { operationId: gmContext, responses: { '200': { description: bounded context } } }
