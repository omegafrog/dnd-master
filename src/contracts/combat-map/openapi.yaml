openapi: 3.1.0
info: { title: Combat Map API, version: 1.0.0 }
paths:
  /internal/v1/combat-maps/prepare:
    post:
      operationId: prepareCombatMap
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adventureId, ownerId, ruleSetId, mapDefinitionId, assetId, assetLocator]
              properties:
                adventureId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                ruleSetId: { type: string, format: uuid }
                mapDefinitionId: { type: string, format: uuid }
                assetId: { type: string }
                assetLocator: { type: string }
                sourceDocumentId: { type: string, format: uuid, description: source document containing the map image asset }
                sourceAssetLocator: { type: string, description: locator of the map image asset in the source document }
                playerSpawnX: { type: integer, minimum: 0 }
                playerSpawnY: { type: integer, minimum: 0 }
                playerTokenId: { type: string, format: uuid, description: stable player token identity supplied by Adventure Runtime }
                situationId: { type: string, format: uuid }
                situationRevision: { type: integer, minimum: 1 }
                turnIndex: { type: integer, minimum: 0 }
                currentScene: { type: string }
                location: { type: string }
                stagePosition: { type: integer, minimum: 1 }
      responses:
        '200': { description: prepared tactical map }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/prepare-upload:
    post:
      operationId: prepareUploadedCombatMap
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: adventureId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: ruleSetId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data: {}
      responses:
        '200': { description: prepared uploaded tactical map }
        '401': { description: internal service authorization required }
  /internal/v1/adventures/{adventureId}/combat-map/player-view:
    get:
      operationId: playerAdventureView
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: latest owner-scoped tactical projection
          content:
            application/json:
              schema: { $ref: './schemas/player-map-view.json' }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/player-view:
    get:
      operationId: playerView
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: filtered versioned view
          content:
            application/json:
              schema: { $ref: './schemas/player-map-view.json' }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/gm-view:
    get:
      operationId: gmView
      parameters:
        - name: ownerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: owner-authorized GM view }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/tactical-triggers:
    post:
      operationId: applyTacticalTrigger
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, commandId, expectedVersion, triggerId, kind, targetIds, qualifyingAction]
              properties:
                ownerId: { type: string, format: uuid }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                triggerId: { type: string }
                kind: { type: string }
                targetIds: { type: array, items: { type: string } }
                transitionId: { type: string }
                qualifyingAction: { type: string, minLength: 1, pattern: '\S', description: authored player action required to qualify the trigger }
      responses:
        '200': { description: planned trigger applied }
        '401': { description: internal service authorization required }
        '400': { description: missing, null, or blank qualifyingAction, or invalid tactical trigger kind }
  /internal/v1/combat-maps/{mapId}/moves:
    post:
      operationId: movePlayer
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, tokenId, positions, distance, appliedEdition, commandId, expectedVersion, previewFingerprint]
              properties:
                playerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                positions:
                  type: array
                  items:
                    type: object
                    required: [x, y]
                    properties:
                      x: { type: integer, minimum: 0 }
                      y: { type: integer, minimum: 0 }
                distance: { type: integer, minimum: 1 }
                appliedEdition: { type: string }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                fingerprint: { type: string, minLength: 1 }
                previewFingerprint: { type: string, minLength: 1, description: server-issued movement preview fingerprint }
                waypoints: { type: array, maxItems: 16, items: { type: object, required: [x, y], properties: { x: { type: integer, minimum: 0 }, y: { type: integer, minimum: 0 } } } }
      responses:
        '200':
          description: moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementOperationResponse' }
        '409': { description: stale map version or preview mismatch }
        '422': { description: movement denied }
  /internal/v1/combat-maps/{mapId}/movement-previews:
    post:
      operationId: previewPlayerMovement
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, tokenId, destination, appliedEdition, expectedVersion]
              properties:
                playerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                destination:
                  type: object
                  required: [x, y]
                  properties:
                    x: { type: integer, minimum: 0 }
                    y: { type: integer, minimum: 0 }
                waypoints: { type: array, maxItems: 16, items: { type: object, required: [x, y], properties: { x: { type: integer, minimum: 0 }, y: { type: integer, minimum: 0 } } } }
                appliedEdition: { type: string, minLength: 1 }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: deterministic public movement preview
          content:
            application/json:
              schema:
                type: object
                required: [mapId, orderedPositions, distance, baseMapVersion, fingerprint]
                properties:
                  mapId: { type: string, format: uuid }
                  orderedPositions: { type: array, items: { type: object, required: [x, y], properties: { x: { type: integer }, y: { type: integer } } } }
                  distance: { type: integer, minimum: 0 }
                  baseMapVersion: { type: integer, format: int64, minimum: 0 }
                  fingerprint: { type: string, minLength: 1 }
        '401': { description: internal service authorization required }
        '409': { description: stale map version }
        '422': { description: movement destination or path is not allowed }
  /internal/v1/combat-maps/{mapId}/movement-operations:
    post:
      operationId: startMovementOperation
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, tokenId, positions, distance, appliedEdition, commandId, expectedVersion, fingerprint, previewFingerprint]
              properties:
                playerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                positions: { type: array, minItems: 2, items: { $ref: '#/components/schemas/GridPosition' } }
                distance: { type: integer, minimum: 1 }
                appliedEdition: { type: string, minLength: 1 }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                fingerprint: { type: string, minLength: 1 }
                previewFingerprint: { type: string, minLength: 1 }
                waypoints: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/GridPosition' } }
      responses:
        '200': { description: durable movement operation, content: { application/json: { schema: { $ref: '#/components/schemas/MovementOperationResponse' } } } }
        '400': { description: preview fingerprint is required }
        '401': { description: internal service authorization required }
        '409': { description: typed reservation, version, command, or operation conflict }
        '422': { description: movement is not allowed }
    get:
      operationId: latestMovementOperation
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: latest durable operation for reconnect, content: { application/json: { schema: { $ref: '#/components/schemas/MovementOperationResponse' } } } }
        '204': { description: no movement operation exists for this map }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/movement-operations/{operationId}:
    get:
      operationId: queryMovementOperation
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: durable typed movement operation and result, content: { application/json: { schema: { $ref: '#/components/schemas/MovementOperationResponse' } } } }
        '401': { description: internal service authorization required }
    delete:
      operationId: cancelMovementOperation
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: cancelled or replayed durable movement result, content: { application/json: { schema: { $ref: '#/components/schemas/MovementOperationResponse' } } } }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/movement-operations/{operationId}/resume:
    post:
      operationId: resumeMovementOperation
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementCheckResultSubmission' }
      responses:
        '200': { description: resumed durable movement result, content: { application/json: { schema: { $ref: '#/components/schemas/MovementOperationResponse' } } } }
        '401': { description: internal service authorization required }
        '409': { description: typed operation conflict }
  /internal/v1/combat-maps/{mapId}/spatial/observe:
    post:
      operationId: observeSpatialFeature
      parameters:
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialActionRequest' } } } }
      responses:
        '200': { description: owner-scoped spatial observation, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialRuntimeResponse' } } } }
        '400': { description: invalid spatial action }
        '401': { description: internal service authorization required }
        '403': { description: map, token, visibility, or line-of-sight ownership denied }
  /internal/v1/combat-maps/{mapId}/spatial/interact:
    post:
      operationId: interactSpatialFeature
      parameters:
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialActionRequest' } } } }
      responses:
        '200': { description: owner-scoped spatial interaction, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialRuntimeResponse' } } } }
        '400': { description: invalid spatial action }
        '401': { description: internal service authorization required }
        '403': { description: map, token, visibility, or line-of-sight ownership denied }
  /internal/v1/combat-maps/{mapId}/spatial/combat-turn-start:
    post:
      operationId: startSpatialCombatTurn
      parameters:
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialTurnRequest' } } } }
      responses:
        '200': { description: spatial combat-turn triggers, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialRuntimeResponse' } } } }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/spatial/advance-durations:
    post:
      operationId: advanceSpatialDurations
      parameters:
        - { name: X-Internal-Token, in: header, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialTurnRequest' } } } }
      responses:
        '200': { description: advanced spatial durations, content: { application/json: { schema: { $ref: '#/components/schemas/SpatialRuntimeResponse' } } } }
        '401': { description: internal service authorization required }
  /internal/v1/combat-maps/{mapId}/ai-state:
    post:
      operationId: controlAiState
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, tokenId, x, y, commandId, expectedVersion]
              properties:
                ownerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                x: { type: integer, minimum: 0 }
                y: { type: integer, minimum: 0 }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
                layers:
                  type: array
                  items:
                    type: object
                    required: [type, value, visibility]
                    properties:
                      type: { type: string }
                      value: { type: string }
                      visibility: { type: string, enum: [AI_ONLY] }
      responses:
        '200': { description: controlled }
  /internal/v1/combat-maps/{mapId}/doors:
    post:
      operationId: changeDoor
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, x, y, open, commandId, expectedVersion]
              properties:
                ownerId: { type: string, format: uuid }
                x: { type: integer, minimum: 0 }
                y: { type: integer, minimum: 0 }
                open: { type: boolean }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: door state changed }
  /internal/v1/combat-maps/{mapId}/game-time:
    post:
      operationId: gameTime
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, adventureId, ruleTurn, causeId, expectedVersion]
              properties:
                ownerId: { type: string, format: uuid }
                adventureId: { type: string, format: uuid }
                ruleTurn: { type: integer, minimum: 0 }
                causeId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: visibility refreshed at committed game time }
  /internal/v1/combat-maps/{mapId}/reveals:
    post:
      operationId: reveal
      parameters:
        - name: X-Internal-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, tokenId, commandId, expectedVersion]
              properties:
                ownerId: { type: string, format: uuid }
                tokenId: { type: string, format: uuid }
                commandId: { type: string, format: uuid }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: token revealed }

components:
  schemas:
    GridPosition:
      type: object
      required: [x, y]
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
    MovementResolutionResult:
      type: object
      required: [requestedPath, traversedPath, finalPosition, mapVersion, publicEvents, status]
      properties:
        requestedPath: { type: array, items: { $ref: '#/components/schemas/GridPosition' } }
        traversedPath: { type: array, items: { $ref: '#/components/schemas/GridPosition' } }
        finalPosition: { $ref: '#/components/schemas/GridPosition' }
        mapVersion: { type: integer, format: int64, minimum: 0 }
        publicEvents: { type: array, items: { type: string } }
        interruptionReason: { type: [string, 'null'] }
        status: { type: string, enum: [COMMITTED, INTERRUPTED, CHECK_REQUIRED, RETRY_REQUIRED, CANCELLED] }
    MovementOperationResponse:
      type: object
      required: [operationId, status, outcomeStatus, requestedPath, traversedPath, finalPosition, publicEvents]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [PREPARING, CHECK_PENDING, RETRY_WAIT, READY_TO_COMMIT, COMMITTED, CANCELLED] }
        outcomeStatus: { type: string, enum: [COMMITTED, INTERRUPTED, CHECK_REQUIRED, RETRY_REQUIRED, CANCELLED] }
        requestedPath: { type: array, items: { $ref: '#/components/schemas/GridPosition' } }
        traversedPath: { type: array, items: { $ref: '#/components/schemas/GridPosition' } }
        finalPosition: { oneOf: [{ $ref: '#/components/schemas/GridPosition' }, { type: 'null' }] }
        mapVersion: { type: integer, format: int64, minimum: 0 }
        publicEvents: { type: array, items: { type: string } }
        interruptionReason: { type: [string, 'null'] }
        pendingCheck: { oneOf: [{ $ref: '#/components/schemas/MovementCheckPending' }, { type: 'null' }] }
    MovementCheckResultSubmission:
      type: object
      required: [commandId, operationId, checkId, success, ownerPlayerId, actor]
      properties:
        commandId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        checkId: { type: string, format: uuid }
        success: { type: boolean }
        ownerPlayerId: { type: string, format: uuid }
        actor: { type: string, enum: [PLAYER] }
    MovementCheckPending:
      type: object
      required: [checkId, operationId, label, diceExpression, ownerPlayerId, actor]
      properties:
        checkId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        label: { type: string }
        diceExpression: { type: string }
        ownerPlayerId: { type: string, format: uuid }
        actor: { type: string, enum: [PLAYER] }
    SpatialActionRequest:
      type: object
      required: [ownerId, tokenId, x, y, expectedVersion, commandId]
      properties:
        ownerId: { type: string, format: uuid }
        tokenId: { type: string, format: uuid }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        commandId: { type: string, format: uuid }
    SpatialTurnRequest:
      type: object
      required: [ownerId, expectedVersion, commandId]
      properties:
        ownerId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        commandId: { type: string, format: uuid }
    SpatialRuntimeResponse:
      type: object
      required: [mapId, mapVersion, publicEvents]
      properties:
        mapId: { type: string, format: uuid }
        mapVersion: { type: integer, format: int64, minimum: 0 }
        publicEvents: { type: array, items: { type: string } }
        operationId: { type: string, format: uuid, nullable: true }
        status: { type: string, nullable: true }
        pendingCheck: { oneOf: [{ $ref: '#/components/schemas/MovementCheckPending' }, { type: 'null' }] }
