ai-game-master:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

ai:
  gm:
    provider: ${GM_PROVIDER:ollama}
    model: ${GM_MODEL:qwen3:8b}
    reasoning: ${GM_REASONING:medium}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/}
    api-key: ${OPENAI_API_KEY:}
    timeout: ${GM_PROVIDER_TIMEOUT:90s}
    retrieval-timeout: ${GM_RETRIEVAL_TIMEOUT:30s}

spring:
  ai:
    retry:
      max-attempts: 1
    ollama:
      init:
        pull-model-strategy: never
      chat:
        options:
          model: exaone3.5:7.8b
          keep-alive: 30m
          num-ctx: 8192
          num-predict: 4096
      embedding:
        options:
          model: qwen3-embedding:0.6b
          keep-alive: 30m
          dimensions: 1024

local-ai:
  ollama:
    base-url: http://127.0.0.1:11434
    chat-model: exaone3.5:7.8b
    embedding-model: qwen3-embedding:0.6b
    allowed-models:
      - qwen3:8b
      - exaone3.5:7.8b
      - qwen3-embedding:0.6b
    request-timeout: 30s
    circuit-failure-threshold: 3
    circuit-reset-timeout: 30s
    retry-max-attempts: 2

retrieval:
  rule-knowledge-base-url: ${RULE_KNOWLEDGE_BASE_URL:http://127.0.0.1:8080}
  timeout: ${RETRIEVAL_TIMEOUT:5s}
---
spring:
  config:
    activate:
      on-profile: quality
  ai:
    ollama:
      chat:
        options:
          model: exaone3.5:7.8b
local-ai:
  ollama:
    chat-model: exaone3.5:7.8b
