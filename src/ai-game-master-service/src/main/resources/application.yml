ai-game-master:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:}

ai:
  codex:
    # Maximum time to wait for a local Codex CLI process authenticated via OAuth.
    timeout: ${CODEX_OAUTH_TIMEOUT:PT10M}
    executable: ${CODEX_EXECUTABLE:codex}
    work-directory: ${CODEX_WORK_DIRECTORY:/tmp}
  gm:
    provider: ${GM_PROVIDER:codex-cli}
    model: ${GM_MODEL:gpt-5.6-luna}
    reasoning: ${GM_REASONING:medium}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/}
    api-key: ${OPENAI_API_KEY:}
    timeout: ${GM_PROVIDER_TIMEOUT:90s}

spring:
  ai:
    retry:
      max-attempts: 1
    ollama:
      init:
        pull-model-strategy: never
      chat:
        options:
          model: exaone3.5:7.8b
          keep-alive: 30m
          num-ctx: 8192
          num-predict: 4096
      embedding:
        options:
          model: qwen3-embedding:0.6b
          keep-alive: 30m
          dimensions: 1024

local-ai:
  ollama:
    base-url: http://127.0.0.1:11434
    chat-model: exaone3.5:7.8b
    embedding-model: qwen3-embedding:0.6b
    allowed-models:
      - qwen3:8b
      - exaone3.5:7.8b
      - qwen3-embedding:0.6b
    request-timeout: 5s
    circuit-failure-threshold: 3
    circuit-reset-timeout: 30s
    retry-max-attempts: 2
---
spring:
  config:
    activate:
      on-profile: quality
  ai:
    ollama:
      chat:
        options:
          model: exaone3.5:7.8b
local-ai:
  ollama:
    chat-model: exaone3.5:7.8b
