server:
  port: 8080

character:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
dice:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
ai-game-master:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:}

logging:
  level:
    com.dndmaster.adventure.application.scenario.compilation.ScenarioCompilationApplicationService: OFF
    com.dndmaster.adventure.api.ScenarioCompilationController: OFF

adventure:
  integration:
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
    identity-access:
      base-url: ${IDENTITY_ACCESS_BASE_URL:http://127.0.0.1:8080/}
    rule-knowledge:
      base-url: ${RULE_KNOWLEDGE_BASE_URL:http://127.0.0.1:8080/}
    ai-game-master:
      base-url: ${AI_GAME_MASTER_BASE_URL:http://127.0.0.1:8080/}
      story-plan-timeout: ${AI_GAME_MASTER_STORY_PLAN_TIMEOUT:450s}
      story-plan-job-timeout: ${ADVENTURE_STORY_PLAN_JOB_TIMEOUT:450s}
    scenario-compilation:
      timeout: 900s

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: dnd-master-local
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    retry:
      max-attempts: 1
    ollama:
      init:
        pull-model-strategy: never
      chat:
        options:
          model: exaone3.5:7.8b
          keep-alive: 30m
          num-ctx: 8192
          num-predict: 4096
      embedding:
        options:
          model: qwen3-embedding:0.6b
          keep-alive: 30m
          dimensions: 1024

rule-knowledge:
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  storage:
    root: ./data/rulebooks
  embedding-model: qwen3-embedding:0.6b
  embedding-dimension: 1024

local-ai:
  ollama:
    base-url: http://127.0.0.1:11434
    chat-model: exaone3.5:7.8b
    embedding-model: qwen3-embedding:0.6b
    allowed-models:
      - qwen3:8b
      - exaone3.5:7.8b
      - qwen3-embedding:0.6b
    request-timeout: ${LOCAL_AI_OLLAMA_REQUEST_TIMEOUT:45s}
    circuit-failure-threshold: 3
    circuit-reset-timeout: 30s

    retry-max-attempts: 2

ai:
  codex:
    # OAuth-backed Codex CLI calls may take several minutes for grounded plans/turns.
    timeout: ${CODEX_OAUTH_TIMEOUT:PT10M}
    executable: ${CODEX_EXECUTABLE:codex}
    work-directory: ${CODEX_WORK_DIRECTORY:/tmp}
  character-tags:
    provider: ${CHARACTER_TAG_PROVIDER:codex-cli}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/}
    api-key: ${OPENAI_API_KEY:}
    model: ${CODEX_CHARACTER_TAG_MODEL:gpt-5.4-mini}
    timeout: ${CODEX_CHARACTER_TAG_TIMEOUT:300s}
    executable: ${CODEX_EXECUTABLE:codex}
    work-directory: ${CODEX_WORK_DIRECTORY:/tmp}

---
spring:
  config:
    activate:
      on-profile: quality
  ai:
    ollama:
      chat:
        options:
          model: exaone3.5:7.8b
local-ai:
  ollama:
    chat-model: exaone3.5:7.8b
