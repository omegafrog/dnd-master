server:
  port: 8080

adventure:
  integration:
    identity-access:
      base-url: ${IDENTITY_ACCESS_BASE_URL:http://127.0.0.1:8080/}
    rule-knowledge:
      base-url: ${RULE_KNOWLEDGE_BASE_URL:http://127.0.0.1:8080/}
    ai-game-master:
      base-url: ${AI_GAME_MASTER_BASE_URL:http://127.0.0.1:8080/}

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: dnd-master-local
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    retry:
      max-attempts: 1
    ollama:
      init:
        pull-model-strategy: never
      chat:
        options:
          model: qwen3:8b
          keep-alive: 30m
          num-ctx: 8192
          num-predict: 4096
      embedding:
        options:
          model: qwen3-embedding:0.6b
          keep-alive: 30m
          dimensions: 1024

rule-knowledge:
  storage:
    root: ./data/rulebooks
  embedding-model: qwen3-embedding:0.6b
  embedding-dimension: 1024

local-ai:
  ollama:
    base-url: http://127.0.0.1:11434
    chat-model: qwen3:8b
    embedding-model: qwen3-embedding:0.6b
    allowed-models:
      - qwen3:8b
      - qwen3-embedding:0.6b
    request-timeout: 120s
    circuit-failure-threshold: 3
    circuit-reset-timeout: 30s
    retry-max-attempts: 2

---
spring:
  config:
    activate:
      on-profile: quality
  ai:
    ollama:
      chat:
        options:
          model: qwen3:8b
local-ai:
  ollama:
    chat-model: qwen3:8b
