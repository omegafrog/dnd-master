tracker:
  mode: github
  github:
    repository: omegafrog/dnd-master
    project_owner: omegafrog
    project_number: 5
    status_field: Workflow Status
    assignees:
      spec_me: "@me"
      codex: "@copilot"

agents:
  high_performance_model: gpt-6-sol
  high_performance_reasoning_effort: medium
  implementation_model: gpt-5.6-terra
  implementation_reasoning_effort: medium
  execution_model: gpt-6-luna
  execution_reasoning_effort: medium
  low_performance_model: gpt-6-luna
  low_performance_reasoning_effort: low
  default_model: gpt-6-luna

eval:
  suite_paths: evals/suites
  case_paths: evals/cases
  runtime_path: .codex/evals/.runtime
  default_environment_profile: p0-default
  default_recording_mode: replay
  default_case_timeout_ms: 300000
  environment_profiles:
    p0-default:
      permission_profile: eval-workspace
      sandbox: workspace-write
      network: restricted
  codex:
    command: ["codex", "exec", "--json", "--ephemeral", "--ignore-user-config"]
    auth_mode: inherited
  quality_grader:
    model: gpt-6-luna
    model_config: configured-default
    command: ["codex", "exec", "--json", "--ephemeral", "--ignore-user-config"]
    timeout_ms: 120000
    rubric_version: "1"
  thresholds:
    hard_gate_failures: 0
    critical_case_pass_rate: 1.0
    pass_rate: 0.95
    mean_quality: 0.80
    p10_quality: 0.65
    max_token_regression: 0.20
    max_latency_regression: 0.25
    max_inconclusive_rate: 0.05
    minimum_conclusive_cases: 0.95
