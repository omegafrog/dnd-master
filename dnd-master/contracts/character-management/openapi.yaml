openapi: 3.1.0
info: { title: Character Management API, version: 1.0.0 }
paths:
  /internal/v1/character-sheets/{sheetId}:
    get:
      operationId: getCharacterSheet
      responses:
        '200':
          description: edition sheet with current version
    put:
      operationId: preserveCharacterSheet
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: If-Match-Version
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: preserved character sheet with updated version
